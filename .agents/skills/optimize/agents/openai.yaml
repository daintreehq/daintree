interface:
  display_name: "Optimize"
  short_description: "Explicit-only, then fully autonomous: move ONE benchmark (or a same-subject handful) and open a PR — never run it proactively."
  default_prompt: "Use $optimize (explicitly invoked, then fully autonomous — never run it proactively, and never ask the human a question: derive every missing input from the repository, write the decision down, and proceed). Resolve the freeform argument to ONE benchmark, or a handful that measure the same subject and would be moved by one fix — never a queue of unrelated targets; an area is a batch of runs, so pick its strongest cluster and say which you passed over. Refuse a scenario with no `correctness` array, or whose predicates a healthy probe does not emit on every iteration; the predicate is healthy only when count === runs AND min === 0 AND max === 0, because max alone cannot tell a working feature from an absent measurement. Before the baseline, run `precommit.mjs` to lock the target metric, the full predicate set, the guards and their tolerances, the threshold, the mode, the iterations and the warmups, plus a hash of scripts/perf — it refuses to be rewritten afterwards, which is what stops a threshold being re-chosen to fit a result. Never target p95/p99: covering the 95th percentile needs ~59 samples and the 99th ~299. Prefer count, size and ratio targets — they need no interleaved A/B and they are the only classes the cross-OS legs can claim. Then loop: one hypothesis per round, smallest change that tests it, committed before it is measured, re-measured with the identical protocol and compared against the CURRENT BEST rather than the baseline. `perf compare` prints REFUSED and exits 0 and a measurement issue is only a warning, so gate every comparison with `node .agents/skills/optimize/check-pair.mjs --precommit <record>` and act on ITS exit code: 1 the pair is not a result, 4 a sound disproof, 5 the machine was too noisy and the hypothesis was never tested — do not revert on a 5. Any claim on a duration, memory or derived-ratio metric requires the interleaved champion/candidate A/B; a stored best.json measured hours earlier is thermal drift, not an opponent. Revert anything whose predicate is unhealthy or whose guards exceed tolerance. Never edit any file under scripts/perf — the apparatus hash enforces it. When the cluster is worked, re-measure EVERY member against the branch point on the final tree: that re-measurement, not the round that selected the hypothesis, is where the reported numbers come from, and it is also the correction for having tried many hypotheses. Then the cross-OS count legs via perf-ab.yml (never a duration off a hosted runner), then typecheck, the FULL unit suite and npm run check — all green is a hard gate on the pull request — then push and open the PR against develop with the evidence in the body. No E2E: only a human names a spec and there is no human here. End with a per-benchmark, per-machine before/after table including the predicate row and every guard, or an honest report that no improvement was available — that is a successful outcome, and it commits nothing and opens no pull request."
