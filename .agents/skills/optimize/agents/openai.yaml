interface:
  display_name: "Optimize"
  short_description: "Explicit-only multi-hour optimisation loop against ONE metric — run only when a human invokes it, never proactively."
  default_prompt: "Use $optimize (an explicitly-invoked, multi-hour workflow — never run it proactively) to move ONE metric on ONE matrix scenario. Collect all seven inputs first: the target as a scenario id plus an exact metric path, its correctness predicate, the mode, the machines and how to reach them, the guard metrics and tolerances, the E2E spec the human chooses (you may not pick one), and the budget. Refuse to start if the scenario has no correctness predicate — a benchmark without one rewards breaking the feature. Measure before changing anything, then loop: one hypothesis per round, smallest change that tests it, re-measure with identical protocol and compare against the CURRENT BEST rather than the baseline. `perf compare` prints REFUSED and exits 0, and a measurement issue is only a warning, so inspect the output rather than trusting the exit code. Revert anything whose predicate is unhealthy or whose guard metrics exceed tolerance. Never edit any file under scripts/perf. Precommit a statistic and threshold before any duration claim, or report raw numbers with no percentage. End with a per-machine before/after table including the predicate and every guard metric, or an honest report that no improvement was available — that is a successful outcome and commits nothing."
