interface:
  display_name: "Optimize"
  short_description: "Explicit-only multi-hour optimisation loop against ONE metric — run only when a human invokes it, never proactively."
  default_prompt: "Use $optimize (an explicitly-invoked, multi-hour workflow — never run it proactively) to move ONE metric on ONE matrix scenario. Collect all seven inputs first: the target as a scenario id plus an exact metric path, its correctness predicate, the mode, the machines and how to reach them, the guard metrics and tolerances, the E2E spec the human chooses (you may not pick one), and the budget. Refuse to start if the scenario has no correctness predicate, or if a healthy run does not emit it on every iteration — a benchmark without one rewards breaking the feature, and a miss count emitted only on failure is not one. The predicate is healthy only when count === runs AND max === 0; max alone cannot tell a working feature from an absent measurement. Measure before changing anything, then loop: one hypothesis per round, smallest change that tests it, committed before it is measured, re-measured with identical protocol and compared against the CURRENT BEST rather than the baseline. `perf compare` prints REFUSED and exits 0, and a measurement issue is only a warning, so gate every comparison with `node .agents/skills/optimize/check-pair.mjs` and act on ITS exit code. Any claim on a duration, memory or derived-ratio metric requires the interleaved champion/candidate A/B in the skill — a stored best.json measured hours earlier is thermal drift, not an opponent — and the headline number comes from a fresh A/B of the branch point against the final tree. Revert anything whose predicate is unhealthy or whose guard metrics exceed tolerance. Never edit any file under scripts/perf. Precommit a statistic and threshold before any machine-dependent claim, or report raw numbers with no percentage. End with a per-machine before/after table including the predicate, every guard metric, both trees' shas and the measured drift, or an honest report that no improvement was available — that is a successful outcome and commits nothing."
