interface:
  display_name: "Stabilize"
  short_description: "Explicit-only stabilization workflow — run only when a human invokes it, never proactively."
  default_prompt: "Use $stabilize (an explicitly-invoked, expensive workflow — never run it proactively) to drive Daintree to a green, stable state one OS at a time: run the full local gate on macOS to green, then dispatch stabilize.yml for Linux to green, then Windows to green — fixing real failures in batches (plus release dry-runs when releasing). Budget one full stabilize.yml run per OS; after it, re-run only the pieces that failed (-f only=..., a single shard, or e2e-single.yml), never re-run the full Linux surface because Windows needed a fix (re-run only named specs/suites a production fix can actually reach), and do not re-validate after the final rebase/merge beyond npm run check + npm run test unless upstream touched the same code as a fix. Never run Linux and Windows in parallel. If fixes were made, squash them into a single commit and merge to develop; if the tree was already green, commit nothing."
