<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daintree — Recovery</title>
    <style>
      :root {
        interpolate-size: allow-keywords;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #0f1219;
        color: #e4e4e7;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        -webkit-app-region: drag;
      }
      .container {
        max-width: 480px;
        text-align: center;
        -webkit-app-region: no-drag;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border-radius: 16px;
        background: #1c1f2b;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg {
        width: 32px;
        height: 32px;
        stroke: #f59e0b;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .description {
        color: #a1a1aa;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 8px;
      }
      .details {
        color: #71717a;
        font-size: 12px;
        font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
        background: #1c1f2b;
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 28px;
        word-break: break-all;
      }
      .project-chip {
        display: inline-block;
        color: #a1a1aa;
        font-size: 12px;
        font-weight: 500;
        background: #1c1f2b;
        border-radius: 999px;
        padding: 4px 12px;
        margin-bottom: 16px;
      }
      .cta-hint {
        color: #f59e0b;
        font-size: 13px;
        line-height: 1.6;
        margin-bottom: 8px;
      }
      .backup-line {
        color: #86efac;
        font-size: 13px;
        line-height: 1.6;
        margin-bottom: 8px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      button {
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.15s,
          opacity 0.15s;
      }
      button:hover {
        opacity: 0.9;
      }
      button:active {
        opacity: 0.8;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-primary {
        background: #3b82f6;
        color: #fff;
      }
      .btn-secondary {
        background: #27272a;
        color: #e4e4e7;
      }
      .status {
        margin-top: 12px;
        font-size: 12px;
        color: #a1a1aa;
        min-height: 16px;
      }
      .status.error {
        color: #f87171;
      }
      .reset-confirm-section {
        height: 0;
        overflow: clip;
        opacity: 0;
        transition:
          height 120ms ease-in,
          opacity 120ms ease-in;
      }
      .reset-confirm-section.open {
        height: auto;
        opacity: 1;
        transition:
          height 200ms ease-out,
          opacity 200ms ease-out;
      }
      .reset-confirm-body {
        background: #1c1f2b;
        border: 1px solid #3f3f46;
        border-radius: 8px;
        padding: 14px 16px;
        margin-top: 10px;
        text-align: left;
      }
      .reset-confirm-description {
        color: #e4e4e7;
        font-size: 13px;
        line-height: 1.6;
      }
      .reset-confirm-detail {
        color: #a1a1aa;
        font-size: 12px;
        line-height: 1.6;
        margin-top: 6px;
      }
      .reset-confirm-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 12px;
      }
      .btn-destructive {
        background: #b91c1c;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">
        <svg viewBox="0 0 24 24">
          <path
            d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
          />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      </div>
      <div class="project-chip" id="project-chip" style="display: none"></div>
      <h1 id="crash-title">Something went wrong</h1>
      <p class="description" id="crash-description">
        The renderer process crashed repeatedly. You can try reloading the window or reset the
        workspace state if the problem persists.
      </p>
      <p class="cta-hint" id="cta-hint" style="display: none"></p>
      <p class="backup-line" id="backup-line" style="display: none"></p>
      <div class="details" id="crash-details">Loading crash details…</div>
      <div class="actions">
        <button class="btn-primary" id="btn-reload">Reload window</button>
        <button class="btn-secondary" id="btn-export-diagnostics">Export diagnostics</button>
        <button class="btn-secondary" id="btn-open-logs">Open logs</button>
        <button
          class="btn-secondary"
          id="btn-reset"
          aria-expanded="false"
          aria-controls="reset-confirm-section"
        >
          Reset workspace state
        </button>
        <div id="reset-confirm-section" class="reset-confirm-section" inert>
          <div class="reset-confirm-body">
            <p class="reset-confirm-description" id="reset-confirm-description">
              This will clear all open sessions and reset sidebar and panel layout.
            </p>
            <p class="reset-confirm-detail" id="reset-confirm-detail" style="display: none"></p>
            <div class="reset-confirm-actions">
              <button class="btn-destructive" id="btn-reset-confirm">Reset workspace</button>
              <button class="btn-secondary" id="btn-reset-cancel">Cancel</button>
            </div>
          </div>
        </div>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>
    <script src="recovery-renderer.js"></script>
  </body>
</html>
