<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="format" content="png" />
    <link rel="stylesheet" href="base.css" />
    <script src="glyphs.js"></script>
    <style>
      /* daintree.org's primary action: a flat accent rectangle, 6px radius. */
      #art {
        height: 44px;
        padding: 0 20px 0 18px;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        background: var(--accent);
        color: var(--on-accent);
        border-radius: var(--radius-control);
      }
      .os {
        display: inline-flex;
        gap: 9px;
        align-items: center;
      }
      .os span {
        width: 16px;
        height: 16px;
        display: inline-flex;
      }
      .os svg {
        width: 100%;
        height: 100%;
      }
      .label {
        font: 600 16px/1 var(--sans);
        letter-spacing: -0.005em;
      }
    </style>
  </head>
  <body>
    <div id="art">
      <span class="os"
        ><span data-glyph="apple"></span><span data-glyph="windows"></span
        ><span data-glyph="linux"></span
      ></span>
      <span class="label">Download Daintree</span>
    </div>
    <script>
      for (const el of document.querySelectorAll("[data-glyph]"))
        el.innerHTML = window.GLYPHS[el.dataset.glyph];
      window.__artReady = true;
    </script>
  </body>
</html>
