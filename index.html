    <style>
      /* ── Skeleton shimmer (GPU-accelerated via translateX) ── */
      @keyframes skeleton-shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      /*
       * Doherty 400ms anti-flicker gate. `animation-fill-mode: backwards`
       * holds the `from` keyframe (opacity: 0) during the 400ms delay so
       * sub-threshold loads never flash a skeleton, then fades to opacity 1
       * over 200ms. Base CSS `opacity: 1` is the post-animation resting
       * state, which lets the JS-driven `.fade-out` transition take over
       * cleanly when removeStartupSkeleton() runs. The previous 10s silent
       * safety-fade is replaced by the visible stuck-state overlay at 6s.
       */
      @keyframes skeleton-doherty-gate {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* ── Progressive reveal entrance ── */
      @keyframes skeleton-reveal {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Stuck-state reveal — animates pointer-events as a discrete property
         so the overlay can't intercept clicks during the 6s delay window. */
      @keyframes skeleton-stuck-reveal {
        from {
          opacity: 0;
          pointer-events: none;
        }
        to {
          opacity: 1;
          pointer-events: auto;
        }
      }

      /* ── Base skeleton container ── */
      #startup-skeleton {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        background: var(--theme-surface-grid, #0e0e0d);
        animation: skeleton-doherty-gate 200ms ease-out 400ms backwards;
        transition: opacity 120ms ease-out;
      }
      #startup-skeleton.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      /* ── Progressive reveal delays ── */
      .skel-reveal {
        opacity: 0;
        animation: skeleton-reveal 400ms ease-out forwards;
      }
      .skel-reveal-d1 {
        animation-delay: 0ms;
      }
      .skel-reveal-d2 {
        animation-delay: 80ms;
      }
      .skel-reveal-d3 {
        animation-delay: 160ms;
      }
      .skel-reveal-d4 {
        animation-delay: 240ms;
      }
      .skel-reveal-d5 {
        animation-delay: 320ms;
      }

      /* ── Toolbar ── */
      .skeleton-toolbar {
        height: 48px;
        flex-shrink: 0;
        background: var(--theme-surface-toolbar, #131312);
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        padding: 4px 16px 0;
        -webkit-app-region: drag;
      }
      .skeleton-toolbar-left {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .skeleton-toolbar-center {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .skeleton-toolbar-right {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        /* Reserve space for Windows native caption controls during the
           pre-React skeleton phase. The var is only injected on win32 by
           injectSkeletonCss; the 0 fallback keeps macOS/Linux unaffected.
           See issue #7951. */
        padding-right: var(--win-caption-width, 0px);
      }

      /* ── Skeleton placeholder shapes (3-tier opacity hierarchy) ── */
      .skel-shape {
        position: relative;
        overflow: hidden;
        border-radius: 4px;
        background: color-mix(
          in oklab,
          var(--theme-surface-sidebar, #131312),
          var(--theme-text-primary, #e4e4e7) 8%
        );
      }
      .skel-shape::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        will-change: transform;
        background: linear-gradient(
          90deg,
          transparent 0%,
          color-mix(
              in oklab,
              var(--theme-surface-sidebar, #131312),
              var(--theme-text-primary, #e4e4e7) 13%
            )
            50%,
          transparent 100%
        );
        animation: skeleton-shimmer 1.5s linear infinite;
      }
      .skel-circle {
        border-radius: 50%;
      }

      /* ── Toolbar shapes: subtler than content shapes ── */
      .skeleton-toolbar .skel-shape {
        background: color-mix(
          in oklab,
          var(--theme-surface-sidebar, #131312),
          var(--theme-text-primary, #e4e4e7) 6%

          transparent 0%,

              var(--theme-surface-sidebar, #131312),
              var(--theme-text-primary, #e4e4e7) 9%

      /* ── Toolbar divider ── */

          var(--theme-text-primary, #e4e4e7) 10%

      /* ── Toolbar button group ── */
      .skel-btn-group {

      /* Toolbar icon: 32x32 hitbox with centered dot */

            var(--theme-text-primary, #e4e4e7) 8%

      /* ── Body layout ── */
      .skeleton-body {

      }

      /* ── Dock bar ── */

      /* ── Sidebar ── */

      /* ── Worktree card skeleton ── */

        flex-direction: column;
        gap: 8px;

      /* ── Main + dock column (everything right of sidebar) ── */

      }

      /* ── Main content area ── */

      /* ── Identity hero (centered stack: mark above, name + meta below —

      .skeleton-logo-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 100%;
        margin-bottom: 24px;
      }
      .skeleton-identity-text {
        display: flex;

      }
      .skeleton-logo {
        width: 141px;
        height: 101px;
        margin-bottom: 16px;
        color: var(--theme-text-primary, #e4e4e7);
        opacity: 0.08;
        /* The stroke-draw reveal is driven by public/skeleton-logo.js, which
           lifts opacity inline while drawing; this transition eases it back to

        transition: opacity 600ms ease-out;
      }
      .skeleton-logo-fill {
        fill: currentColor;
        shape-rendering: geometricPrecision;
      }
      .skeleton-title {
        position: relative;
        overflow: hidden;
        width: 150px;
        height: 28px;

          var(--theme-text-primary, #e4e4e7) 8%

      .skeleton-title::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        will-change: transform;
        background: linear-gradient(
          90deg,
          transparent 0%,
          color-mix(
              in oklab,
              var(--theme-surface-grid, #0e0e0d),
              var(--theme-text-primary, #e4e4e7) 13%
            )
            50%,
          transparent 100%
        );
        animation: skeleton-shimmer 1.5s linear infinite;
      }

      /* ── Project identity (painted on cold-start switch — #9162) ──
         When the main process resolves the destination project it sets the
         title's text content and adds these classes, collapsing the shimmer
         placeholder into real "emoji  name" text and tinting the logo with the
         project's accent color. */
      .skeleton-title.skeleton-title--identified {
        width: auto;
        height: auto;
        min-height: 24px;
        background: none;
        display: block;
        /* Long injected names ellipsize instead of stretching the hero — the
           React layout truncates this path too. */
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 22px;
        font-weight: 600;
        line-height: 1.4;
        color: var(--theme-text-primary, #e4e4e7);
        opacity: 0;
        animation: skeleton-reveal 400ms ease-out forwards;
      }
      .skeleton-title.skeleton-title--identified::after {
        content: none;
        animation: none;
      }
      .skeleton-logo-section--identified .skeleton-logo {
        color: var(--theme-accent-primary, #e4e4e7);
        opacity: 0.16;
      }

      /* ── Stuck-state card (fades in at 6s if React never hydrates) ── */
      .skeleton-stuck {
        position: absolute;
        bottom: 56px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        width: min(360px, calc(100% - 32px));
        padding: 16px 18px;
        border-radius: 8px;
        border: 1px solid

            var(--theme-surface-grid, #0e0e0d),

        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        opacity: 0;
        pointer-events: none;
        animation: skeleton-stuck-reveal 200ms ease-out forwards;
        animation-delay: 6000ms;
      }
      .skeleton-stuck-title {

        font-size: 15px;
        font-weight: 600;
        line-height: 1.5;
        color: var(--theme-text-primary, #e4e4e7);

        .skeleton-stuck-btn {
          border-color: color-mix(
            in oklab,
            var(--theme-surface-grid, #cdd3db),
            var(--theme-text-primary, #1e252e) 18%
          );
          background: color-mix(
            in oklab,
            var(--theme-surface-grid, #cdd3db),
            var(--theme-text-primary, #1e252e) 6%
          );
          color: var(--theme-text-primary, #1e252e);

          );

        #startup-skeleton {
          animation: none;

        .skeleton-title::after {
          animation: none;
          display: none;

          transition: none;

        .skeleton-title.skeleton-title--identified {

        }
