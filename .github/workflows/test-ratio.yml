name: Test Ratio

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test ratio check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-test-ratio.mjs

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-ratio-summary
          path: dist/test-ratio-summary.md
          retention-days: 30
          if-no-files-found: ignore

  classify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Classify PR for test coverage
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        # Informational only — the script always exits 0, and a transient
        # git-diff failure must not surface as a red check on the PR.
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | node scripts/check-pr-test-ratio.mjs
