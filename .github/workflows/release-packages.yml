name: Release (Plugin Packages)

# npm publish for the plugin-ecosystem workspace packages
# (@daintreehq/plugin-sdk, @daintreehq/plugin-vite, daintree-plugin,
# create-daintree-plugin). Kept separate from the Electron app release
# workflows (release-{macos,linux,windows}.yml), which fire on `v*` tags. Each
# package versions independently via its own per-package tag (`sdk-v*`,
# `plugin-vite-v*`, `daintree-plugin-v*`, `create-daintree-plugin-v*`);
# pushing any of them publishes every package whose version is not yet on the
# registry (the version-existence guard below skips the rest), so a tag for
# one package re-runs the others as no-ops. `workflow_dispatch` remains for
# manual/dry runs.
#
# Auth: npm Trusted Publishing (OIDC). Each package is registered on
# npmjs.com with this repo + this workflow file as its trusted publisher, the
# job mints a short-lived OIDC token via `id-token: write`, and npm attaches
# provenance automatically. No stored secret. Two consequences worth knowing:
# npm only lets you register a trusted publisher for a package that already
# exists, so the very first version of each package is published by hand from
# a logged-in machine; and the OIDC exchange needs npm >= 11.5.1, which Node 22
# does not bundle, hence the explicit npm upgrade step.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build, pack and smoke-install the tarballs without publishing to npm"
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "sdk-v*"
      - "plugin-vite-v*"
      - "daintree-plugin-v*"
      - "create-daintree-plugin-v*"

permissions:
  contents: read
  # Lets the runner mint the short-lived OIDC token npm Trusted Publishing
  # exchanges for publish credentials.
  id-token: write

concurrency:
  # Fixed (ref-independent) key so two near-simultaneous package tags serialize
  # instead of racing each other into EPUBLISHCONFLICT on the shared registry.
  group: release-packages
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PUBLISH_WORKSPACES: packages/plugin-sdk packages/plugin-vite packages/daintree-plugin packages/create-daintree-plugin

jobs:
  publish:
    name: Build and publish packages
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          clean: true
          # Full history: the "tag is on main" ancestry check below needs it.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g "npm@^11.5.1"
          npm --version

      # `--ignore-scripts` skips the app's native-module rebuild (postinstall)
      # and each workspace's `prepare` build — none are needed to publish the
      # pure-JS/TS packages, and `packages:build` below produces dist/ explicitly.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Build first: `--ignore-scripts` skipped each workspace's `prepare`, so
      # dist/ is absent. create-daintree-plugin's typecheck resolves
      # daintree-plugin via its dist `types` entry, so dist must exist before
      # the typecheck step runs.
      - name: Build packages
        run: npm run packages:build

      - name: Typecheck packages
        run: |
          for dir in $PUBLISH_WORKSPACES; do
            npm run typecheck --workspace="$dir"
          done

      # The packages' own suites, the shared mock host the SDK's `./testing`
      # entry ships, and the sample plugins that exercise the published package
      # names. A regression here means the published SDK/host contract is broken.
      - name: Package and contract tests
        run: npx vitest run packages shared/testing plugins/sample plugins/sample-project

      # The SDK's declaration snapshots must match the dist just built; a drift
      # here is a public API change nobody reviewed.
      - name: Check SDK API surface
        run: node scripts/ci/check-api-surface.mjs --check

      # On a tag push, assert the tag's version matches the triggering package's
      # package.json. The tag is only a trigger — without this check a mistagged
      # release (e.g. sdk-v0.2.0 while package.json still reads 0.1.0) would
      # silently no-op via the version guard instead of failing loudly.
      - name: Validate tag matches package version
        if: ${{ github.event_name == 'push' }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          case "$tag" in
            create-daintree-plugin-v*) dir=packages/create-daintree-plugin; ver="${tag#create-daintree-plugin-v}" ;;
            daintree-plugin-v*)        dir=packages/daintree-plugin;        ver="${tag#daintree-plugin-v}" ;;
            plugin-vite-v*)            dir=packages/plugin-vite;            ver="${tag#plugin-vite-v}" ;;
            sdk-v*)                    dir=packages/plugin-sdk;             ver="${tag#sdk-v}" ;;
            *) echo "Unrecognized package tag: $tag" >&2; exit 1 ;;
          esac
          pkgver=$(node -p "require('./$dir/package.json').version")
          if [ "$ver" != "$pkgver" ]; then
            echo "Tag $tag implies version $ver but $dir/package.json is $pkgver" >&2
            exit 1
          fi
          echo "Tag $tag matches $dir@$pkgver"

      # The SDK's types describe a shipped host, so anything that publishes —
      # a package tag or a manual run with dry_run off — must be a commit on
      # `main` (release merges only), never a feature branch or `develop`
      # ahead of an app release. Dry runs may come from any ref.
      - name: Verify the published commit is on main
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tagged commit $GITHUB_SHA is not reachable from main"
            exit 1
          fi

      # Pack the exact tarballs npm would publish and install them into an
      # empty project from the tarballs alone. The workspace symlinks hide a
      # whole class of defects (a relative import that escapes `dist`, a peer
      # that only resolves from the monorepo root, a bin with the wrong shebang),
      # and this is the only step that sees the packages the way an author does.
      - name: Pack and smoke-install the tarballs
        run: |
          set -euo pipefail
          tarballs="$(mktemp -d)"
          for dir in $PUBLISH_WORKSPACES; do
            npm pack --workspace="$dir" --pack-destination "$tarballs" >/dev/null
          done
          ls -1 "$tarballs"
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y >/dev/null
          # All four tarballs in one install so `create-daintree-plugin`'s
          # dependency on `daintree-plugin` resolves to the sibling tarball, not
          # the registry (where it may not exist yet). Peers are installed
          # explicitly so every entry point can actually be imported.
          npm install --no-audit --no-fund "$tarballs"/*.tgz react@19 react-dom@19 zod@4 vite@8 >/dev/null
          node --input-type=module -e "
            const sdk = await import('@daintreehq/plugin-sdk');
            if (typeof sdk.PLUGIN_STYLE_ROOT_ATTRIBUTE !== 'string') throw new Error('sdk: PLUGIN_STYLE_ROOT_ATTRIBUTE missing');
            if (typeof sdk.PLUGIN_PROCESS_STREAM_CHANNEL !== 'string') throw new Error('sdk: PLUGIN_PROCESS_STREAM_CHANNEL missing');
            await import('@daintreehq/plugin-sdk/react');
            await import('@daintreehq/plugin-sdk/files');
            const testing = await import('@daintreehq/plugin-sdk/testing');
            if (typeof testing.createMockHost !== 'function') throw new Error('sdk/testing: createMockHost missing');
            const vite = await import('@daintreehq/plugin-vite');
            if (typeof vite.daintreePlugin !== 'function') throw new Error('plugin-vite: daintreePlugin missing');
            console.log('entry points import ok');
          "
          # Through `.bin`, so the `bin` mapping, the shebang and the executable
          # bit are all exercised, not just the file behind them.
          ./node_modules/.bin/daintree-plugin --version
          ./node_modules/.bin/daintree-plugin --help >/dev/null
          ./node_modules/.bin/create-daintree-plugin --version
          ./node_modules/.bin/create-daintree-plugin --help >/dev/null
          echo "tarball smoke install ok"

      # Publish in dependency order: plugin-sdk first (others peer/depend on it),
      # then the vite preset and the CLIs. Each publish is guarded by a
      # version-existence check so re-running after a partial failure skips
      # already-published versions instead of erroring on EPUBLISHCONFLICT and
      # blocking the remaining packages.
      - name: Publish to npm
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          publish_if_new() {
            local dir="$1"
            local name version view_out view_status
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            # Capture stderr so a transient registry error (503/auth/rate-limit)
            # isn't misread as "not published" — that would publish over an
            # existing version and fail with EPUBLISHCONFLICT. Only a genuine
            # 404 ("not found"/"E404") means the version is new; anything else
            # aborts so the failure is loud rather than a corrupt publish.
            if view_out=$(npm view "$name@$version" version 2>&1); then
              echo "Skipping $name@$version — already published"
              return 0
            else
              view_status=$?
            fi
            if echo "$view_out" | grep -qiE "E404|not found|is not in this registry"; then
              # --access public is required on a scoped package's first publish
              # (scoped packages default to restricted); explicit here rather
              # than relying solely on each package's publishConfig.access.
              npm publish --workspace="$dir" --access public
            else
              echo "npm view failed for $name@$version (exit $view_status): $view_out" >&2
              return 1
            fi
          }
          for dir in $PUBLISH_WORKSPACES; do
            publish_if_new "$dir"
          done

      # A successful `npm publish` is not the same as the registry serving the
      # version. Metadata converges a little behind the publish, so poll rather
      # than assert once — and a published version is immutable, so a false
      # failure here could never be retried away.
      - name: Verify the registry serves every package version
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          for dir in $PUBLISH_WORKSPACES; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            resolved=""
            for _ in 1 2 3 4 5 6; do
              resolved="$(npm view "$name@$version" version 2>/dev/null || true)"
              [ "$resolved" = "$version" ] && break
              sleep 10
            done
            if [ "$resolved" != "$version" ]; then
              echo "::error::$name@$version is not being served by the registry (got '${resolved:-nothing}')"
              exit 1
            fi
            echo "$name@$version is live"
          done
