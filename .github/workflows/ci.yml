name: CI

# Pull requests only. Nothing runs on a push to `develop` or `main`: the daily
# stabilization run (.agents/skills/stabilize) checks the merged tree, the
# whole unit suite included, and the release workflows check what ships.
# warm-caches.yml keeps the caches these jobs restore fresh on `develop`.
on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      os:
        description: "OS to run the static and lint jobs on (manual dispatch only — PRs always run ubuntu)"
        type: choice
        options:
          - ubuntu
          - windows
          - both
        default: ubuntu

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # onnxruntime-node (transitive via avr-vad for CPU-only Silero VAD) tries
  # to download optional CUDA/TensorRT GPU binaries from api.nuget.org on
  # postinstall. Daintree's VAD runs on CPU; the GPU binaries are never
  # loaded. The CI runner pool can't reliably reach nuget.org, so skip the
  # GPU download and let the bundled CPU runtime + binding node module
  # (already in the npm tarball) do the work.
  ONNXRUNTIME_NODE_INSTALL: "skip"

# The org's runners are shared by every open PR (20 jobs at once, 5 on macOS),
# so a PR only takes the jobs its diff needs. `changes` reads the diff; every
# other job waits on it, then they all run at once. A draft runs nothing until
# it is marked ready for review.
jobs:
  # What the diff touches. A manual dispatch has no PR base, so it runs
  # everything, the whole unit suite included.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.diff.outputs.base }}
      code: ${{ steps.diff.outputs.code }}
      packages: ${{ steps.diff.outputs.packages }}
      catalog: ${{ steps.diff.outputs.catalog }}
      workflow: ${{ steps.diff.outputs.workflow }}
      github: ${{ steps.diff.outputs.github }}

    steps:
      # The checkout is the merge commit, so its first parent is exactly the
      # base the pull request changes.
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify changed files
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            {
              echo "base="
              echo "code=true"
              echo "packages=true"
              echo "catalog=false"
              echo "workflow=true"
              echo "github=true"
            } >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: running every job and the whole unit suite."
            exit 0
          fi

          base=$(git rev-parse HEAD^1)
          changed="$RUNNER_TEMP/changed.txt"
          # --no-renames lists a moved file under both paths, so moving one out
          # of a gated area still counts against that area.
          git diff --no-renames --name-only "$base" HEAD > "$changed"
          echo "base=${base}" >> "$GITHUB_OUTPUT"

          has() { grep -qE "$1" "$changed" && echo true || echo false; }

          # Markdown is still formatted, so `static` runs for a docs-only diff;
          # lint, tests and build have nothing to check there.
          if grep -qvE '(\.md$|^docs/)' "$changed"; then code=true; else code=false; fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"

          # The plugin packages build from their own sources and from the parts
          # of the app they import or bundle: shared types and utils, plugin
          # schemas, services and archive constants, the panel, the plugin UI kit
          # and its components and styles, the sample project, and the build
          # scripts. Their transitive imports reach further into src/; the daily
          # stabilization run builds and smoke-tests the packages too. A README
          # change alone doesn't need the smoke.
          if grep -vE '\.md$' "$changed" | grep -qE '^(packages/|shared/|plugins/sample-project/|electron/(schemas|types|services/plugin)/|electron/services/PluginArchive|electron/utils/pluginArchiveConstants|src/(panel|pluginUi|services/plugin|styles|components/(ui|PluginKit))/|src/index\.css$|scripts/lib/|scripts/build-plugin-ui-browser\.mjs$|scripts/ci/(packages-consumer-smoke|check-api-surface)\.mjs$|package(-lock)?\.json$|tsconfig[^/]*\.json$|\.github/(workflows/ci\.yml$|actions/install/))'; then packages=true; else packages=false; fi
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"
          echo "catalog=$(has '^plugins/catalog\.json$')" >> "$GITHUB_OUTPUT"
          echo "workflow=$(has '^\.github/(workflows/ci\.yml$|actions/install/)')" >> "$GITHUB_OUTPUT"
          echo "github=$(has '^\.github/')" >> "$GITHUB_OUTPUT"

          {
            echo "### Changed files: $(wc -l < "$changed" | tr -d ' ')"
            echo
            echo "base \`${base}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_OUTPUT"

  # Typecheck, the codegen and drift guards, and formatting. Later steps run
  # even when an earlier one fails, so one push reports every problem.
  static:
    needs: changes
    # PRs run ubuntu only. Manual dispatch can opt into windows or both
    # via `gh workflow run CI --ref <branch> -f os=windows` (or `os=both`).
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os || 'ubuntu') == 'both' && '["ubuntu-latest","windows-latest"]' || (inputs.os || 'ubuntu') == 'windows' && '["windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        id: install
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}

      # One compiler at a time: on 4 cores three at once peaked at 17.6-19 GB
      # summed RSS against the runner's 16 GB, and ran no faster than one at a
      # time (41 s, 9.1 GB peak). Past that the VM swap-thrashes, stops
      # answering, and the job is cancelled at 25 minutes with no log (#18000).
      # The script's deadline and memory floor stop it with a report of every
      # unfinished project while the runner can still write one; the step
      # timeout is the backstop, leaving the guard and format steps their time.
      - name: Typecheck
        timeout-minutes: 8
        run: npm run typecheck
        env:
          TYPECHECK_CONCURRENCY: "1"
          TYPECHECK_TIMEOUT_MINUTES: "6"
          TYPECHECK_MIN_AVAILABLE_MB: "1024"

      - name: Codegen and drift guards
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:guards

      # Prettier's cache is keyed on each file's content and a hash of the
      # Prettier version, Node version and resolved options, so a restored entry
      # can only skip a file that is byte-identical under identical settings.
      # Keyed per commit so every run saves what it checked.
      - name: Restore Prettier cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            prettier-${{ runner.os }}-

      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check -- --cache --cache-strategy content

  # The ESLint ratchet. Each ESLint worker thread builds its own typed program:
  # two threads peaked at 11.5 GB locally and four at 15.5 GB, against the
  # runner's 16 GB.
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os || 'ubuntu') == 'both' && '["ubuntu-latest","windows-latest"]' || (inputs.os || 'ubuntu') == 'windows' && '["windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint (ESLint ratchet)
        run: npm run lint:ratchet
        env:
          ESLINT_CONCURRENCY: "2"

  # The unit tests the diff can reach, on one runner: Vitest's `--changed`
  # follows the import graph from every changed file to the test files that
  # import it, and runs the whole suite when a force-rerun trigger changes
  # (any package.json, the Vitest or Vite config, the setup file and what it
  # imports). A test that reads a file through `fs` rather than importing it
  # isn't reached; the daily stabilization run covers the whole suite. Ubuntu
  # only by design: Windows unit coverage runs in stabilize.yml.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A force-rerun trigger means the whole suite on one runner, about 35 minutes.
    timeout-minutes: 50
    outputs:
      host_scripts: ${{ steps.select.outputs.host_scripts }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Electron's npm package downloads its binary on first use, not at install,
      # so the cached tree has none. pluginSdkResolution.electron.test.ts runs
      # the worker bootstrap under it; fetching it here, with retries, keeps a
      # CDN blip out of the test result.
      - name: Provision Electron binary
        run: node scripts/ci/verify-electron-install.mjs

      # Vitest runs files longest-first using the durations it recorded on the
      # previous run, so the slow files (the perf liveness guard spawns a child
      # per scenario) start early instead of setting the tail.
      - name: Cache Vitest results
        uses: actions/cache@v5
        with:
          path: node_modules/.vite/vitest
          key: vitest-results-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vitest-results-${{ runner.os }}-

      - name: Select affected tests
        id: select
        shell: bash
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: |
          set -euo pipefail
          # Vitest also counts modified and untracked files as changed, so a
          # step that dirties the tree would widen the selection.
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "::warning::The working tree is not clean before test selection; these count as changed:"
            echo "$dirty"
          fi
          selected="$RUNNER_TEMP/selected.txt"
          npx vitest list --filesOnly ${BASE:+--changed "$BASE"} > "$selected"
          count=$(grep -c . "$selected" || true)
          total=$(npx vitest list --filesOnly | grep -c . || true)
          if grep -q 'hostInstaller\.realShell\.test\.ts' "$selected"; then host=true; else host=false; fi
          echo "host_scripts=${host}" >> "$GITHUB_OUTPUT"
          {
            echo "### Unit tests: ${count} of ${total} files"
            echo
            if [ -n "$BASE" ]; then echo "Affected by the diff against \`${BASE}\`."; else echo "Whole suite (manual dispatch)."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Running ${count} of ${total} test files."

      - name: Test (vitest, affected files)
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: npx vitest run --passWithNoTests ${BASE:+--changed "$BASE"}

      # The workflow guards in scripts/ci read the YAML through fs, so no import
      # graph leads from a workflow change to them.
      - name: Test (workflow guards)
        if: ${{ !cancelled() && needs.changes.outputs.base != '' && needs.changes.outputs.github == 'true' }}
        run: npx vitest run scripts/ci

  # The host installer's swap and rollback scripts run on a Mac's /bin/sh and BSD
  # tools as well as Linux's, and the unit job only sees Linux's. Runs only when
  # the diff reaches that test (the unit job reports it) or changes CI itself,
  # since macOS runners are the scarcest.
  host-scripts-macos:
    needs: [changes, test]
    if: ${{ !cancelled() && (needs.test.outputs.host_scripts == 'true' || needs.changes.outputs.workflow == 'true') }}
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test (host swap and rollback scripts)
        run: npx vitest run electron/remote/client/__tests__/hostInstaller.realShell.test.ts

  # The plugin packages as an outside author gets them: packed tarballs, every
  # exports subpath, the bins, and a scaffolded plugin built against them. The
  # release workflow runs the same script before publishing; this catches a
  # version or export mismatch while it is still a PR.
  packages:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build packages
        run: npm run packages:build

      - name: Package consumer smoke
        run: node scripts/ci/packages-consumer-smoke.mjs

  # Downloads every community catalog entry a pull request adds or changes and
  # holds it to its listing (#16778).
  plugin-catalog:
    needs: changes
    if: needs.changes.outputs.catalog == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check added and changed entries
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
        run: npx tsx scripts/ci/check-plugin-catalog.ts --base "${BASE_SHA}"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fontconfig cache key
        id: fontconfig-cache-key
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/fontconfig
          source /etc/os-release
          echo "ubuntu=${ID}-${VERSION_ID}-${VERSION_CODENAME}" >> "$GITHUB_OUTPUT"
          echo "fc_version=$(fc-cache --version 2>&1 | head -1)" >> "$GITHUB_OUTPUT"
          echo "font_pkg_hash=$(dpkg-query -W -f='${Package} ${Version}\n' 2>/dev/null | grep -E '^fonts-|^fontconfig' | LC_ALL=C sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache fontconfig
        id: cache-fontconfig
        uses: actions/cache@v5
        with:
          path: ~/.cache/fontconfig
          key: fontconfig-${{ runner.os }}-${{ runner.arch }}-${{ steps.fontconfig-cache-key.outputs.ubuntu }}-${{ steps.fontconfig-cache-key.outputs.fc_version }}-${{ steps.fontconfig-cache-key.outputs.font_pkg_hash }}

      - name: Warm fontconfig cache
        run: fc-cache -fv

      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Canopy's reader model (#16415): the build fetches it from its pinned
      # revision and hashes whatever is here, restored or not.
      - name: Cache Canopy reader model
        uses: actions/cache@v5
        with:
          path: electron/resources/canopy-reader
          key: canopy-reader-${{ runner.os }}-${{ hashFiles('electron/services/canopy/canopy-reader-manifest.json') }}

      - name: Build
        run: npm run build

      # Hard security gate (#9148) — no continue-on-error. Fails the build if any
      # E2E test backdoor survived the production strip in dist-electron/electron/preload.cjs.
      - name: Check preload backdoors stripped
        run: npm run check:preload-backdoors

      # A boundary, not a budget: no threshold to churn. Fails if a picker
      # guest script, resolver, compiler, parser or map decoder lands in a
      # chunk the renderer loads before anyone opens the Element Picker.
      - name: Check Element Picker bundles stay lazy
        run: npm run check:element-picker-bundles

      # Same shape for plugins that ship disabled (#14129): only a view
      # registration stub may sit in a startup chunk, never the plugin itself.
      - name: Check default-disabled plugins stay lazy
        run: npm run check:vanilla-plugin-bundles

      # And for the Radix overlays (#17028): menus, popovers, tooltips and
      # selects load on first gesture, so none may ride in a startup chunk.
      - name: Check Radix overlays stay deferred
        run: npm run check:radix-overlay-bundles

      # Performance/size budgets (renderer bundle, first-render chunk, import
      # counts, compiler perf) are intentionally NOT run in CI during pre-1.0
      # development — premature gating just churns thresholds and blocks rapid
      # iteration, and Electron apps aren't payload-sensitive the way web apps
      # are. Reintroduce them (first as non-blocking signal, later as gates)
      # once the 1.0 feature set is frozen. The `*-budget:*` npm scripts remain
      # available to run locally on demand.

      - name: Smoke test
        run: xvfb-run --auto-servernum npm run test:smoke
        env:
          NODE_ENV: production
          ELECTRON_ENABLE_LOGGING: "1"
          DBUS_SESSION_BUS_ADDRESS: /dev/null
          SMOKE_RUNS: "1"
          SMOKE_TIMEOUT_MS: "210000"
          SMOKE_RETRIES: "1"
        timeout-minutes: 10

  # Gate job — use this as the sole required status check in branch protection.
  # Insulates against matrix/job name changes breaking required checks. A job
  # the diff didn't need is skipped and passes. A draft skips the gate too, and
  # GitHub counts a skipped check as passing, so a draft's checks prove nothing:
  # merge automation must leave drafts out (merge-prs does).
  ci-ok:
    if: ${{ always() && needs.changes.result != 'skipped' }}
    needs: [changes, static, lint, test, host-scripts-macos, packages, plugin-catalog, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
