name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      os:
        description: "OS to run check on (manual dispatch only — push/PR always runs ubuntu)"
        type: choice
        options:
          - ubuntu
          - windows
          - both
        default: ubuntu

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # onnxruntime-node (transitive via avr-vad for CPU-only Silero VAD) tries
  # to download optional CUDA/TensorRT GPU binaries from api.nuget.org on
  # postinstall. Daintree's VAD runs on CPU; the GPU binaries are never
  # loaded. The CI runner pool can't reliably reach nuget.org, so skip the
  # GPU download and let the bundled CPU runtime + binding node module
  # (already in the npm tarball) do the work.
  ONNXRUNTIME_NODE_INSTALL: "skip"

jobs:
  # Typecheck + lint + format. These are whole-repo operations that can't be
  # sharded, so they stay in one job. Unit tests used to live here too, but the
  # suite ballooned (~1,400 files) and dominated wall-clock, so they were split
  # out into the sharded `test` matrix below — the per-job `npm ci` setup cost
  # is now small relative to the test runtime it parallelises away.
  check:
    # Push/PR runs ubuntu only. Manual dispatch can opt into windows or both
    # via `gh workflow run CI --ref <branch> -f os=windows` (or `os=both`).
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os || 'ubuntu') == 'both' && '["ubuntu-latest","windows-latest"]' || (inputs.os || 'ubuntu') == 'windows' && '["windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Check (typecheck + lint + format)
        run: npm run check

  # Unit tests, sharded across SHARD_TOTAL runners via vitest's native --shard.
  # Vitest splits test files deterministically across shards with no merge step
  # (we don't collect coverage in CI). Each shard pays its own npm ci, but they
  # run in parallel so the test phase wall-clock drops to ~1/SHARD_TOTAL. To
  # change the shard count, update SHARD_TOTAL and keep the `shard:` matrix
  # list as [1, 2, ..., SHARD_TOTAL].
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os || 'ubuntu') == 'both' && '["ubuntu-latest","windows-latest"]' || (inputs.os || 'ubuntu') == 'windows' && '["windows-latest"]' || '["ubuntu-latest"]') }}
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      SHARD_TOTAL: 4

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Test (vitest unit, shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }})
        run: npm run test -- --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Fontconfig cache key
        id: fontconfig-cache-key
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/fontconfig
          source /etc/os-release
          echo "ubuntu=${ID}-${VERSION_ID}-${VERSION_CODENAME}" >> "$GITHUB_OUTPUT"
          echo "fc_version=$(fc-cache --version 2>&1 | head -1)" >> "$GITHUB_OUTPUT"
          echo "font_pkg_hash=$(dpkg-query -W -f='${Package} ${Version}\n' 2>/dev/null | grep -E '^fonts-|^fontconfig' | LC_ALL=C sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache fontconfig
        id: cache-fontconfig
        uses: actions/cache@v5
        with:
          path: ~/.cache/fontconfig
          key: fontconfig-${{ runner.os }}-${{ runner.arch }}-${{ steps.fontconfig-cache-key.outputs.ubuntu }}-${{ steps.fontconfig-cache-key.outputs.fc_version }}-${{ steps.fontconfig-cache-key.outputs.font_pkg_hash }}

      - name: Warm fontconfig cache
        run: fc-cache -fv

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Hard security gate (#9148) — no continue-on-error. Fails the build if any
      # E2E test backdoor survived the production strip in dist-electron/electron/preload.cjs.
      - name: Check preload backdoors stripped
        run: npm run check:preload-backdoors

      # Performance/size budgets (renderer bundle, first-render chunk, import
      # counts, compiler perf) are intentionally NOT run in CI during pre-1.0
      # development — premature gating just churns thresholds and blocks rapid
      # iteration, and Electron apps aren't payload-sensitive the way web apps
      # are. Reintroduce them (first as non-blocking signal, later as gates)
      # once the 1.0 feature set is frozen. The `*-budget:*` npm scripts remain
      # available to run locally on demand.

      - name: Smoke test
        run: xvfb-run --auto-servernum npm run test:smoke
        env:
          NODE_ENV: production
          ELECTRON_ENABLE_LOGGING: "1"
          DBUS_SESSION_BUS_ADDRESS: /dev/null
          SMOKE_RUNS: "1"
          SMOKE_TIMEOUT_MS: "210000"
          SMOKE_RETRIES: "1"
        timeout-minutes: 10

  # Gate job — use this as the sole required status check in branch protection.
  # Insulates against matrix/job name changes breaking required checks.
  ci-ok:
    if: always()
    needs: [check, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
