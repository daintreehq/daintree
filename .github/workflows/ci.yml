name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      os:
        description: "OS to run the static and lint jobs on (manual dispatch only — push/PR always runs ubuntu)"
        type: choice
        options:
          - ubuntu
          - windows
          - both
        default: ubuntu

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # onnxruntime-node (transitive via avr-vad for CPU-only Silero VAD) tries
  # to download optional CUDA/TensorRT GPU binaries from api.nuget.org on
  # postinstall. Daintree's VAD runs on CPU; the GPU binaries are never
  # loaded. The CI runner pool can't reliably reach nuget.org, so skip the
  # GPU download and let the bundled CPU runtime + binding node module
  # (already in the npm tarball) do the work.
  ONNXRUNTIME_NODE_INSTALL: "skip"

# Every job starts at once and none waits on another, so the run takes as long
# as its slowest job. `npm run check` is split between `static` and `lint`
# because run back to back they were 17-20 minutes on one runner.
jobs:
  # Typecheck, the codegen and drift guards, and formatting. Later steps run
  # even when an earlier one fails, so one push reports every problem.
  static:
    # Push/PR runs ubuntu only. Manual dispatch can opt into windows or both
    # via `gh workflow run CI --ref <branch> -f os=windows` (or `os=both`).
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os || 'ubuntu') == 'both' && '["ubuntu-latest","windows-latest"]' || (inputs.os || 'ubuntu') == 'windows' && '["windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        id: install
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Typecheck
        run: npm run typecheck

      - name: Codegen and drift guards
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:guards

      # Prettier's cache is keyed on each file's content and a hash of the
      # Prettier version, Node version and resolved options, so a restored entry
      # can only skip a file that is byte-identical under identical settings.
      # Keyed per commit so every run saves what it checked.
      - name: Restore Prettier cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            prettier-${{ runner.os }}-

      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check -- --cache --cache-strategy content

  # The ESLint ratchet. Each ESLint worker thread builds its own typed program:
  # two threads peaked at 11.5 GB locally and four at 15.5 GB, against the
  # runner's 16 GB.
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os || 'ubuntu') == 'both' && '["ubuntu-latest","windows-latest"]' || (inputs.os || 'ubuntu') == 'windows' && '["windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint (ESLint ratchet)
        run: npm run lint:ratchet
        env:
          ESLINT_CONCURRENCY: "2"

  # Unit suite, sharded across ubuntu runners. Ubuntu-only by design — Windows
  # unit coverage runs in stabilize.yml.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The matrix list cannot read env, so it stays a literal: keep it [1..SHARD_TOTAL].
    env:
      SHARD_TOTAL: 6
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      # A denominator larger than the list skips whole partitions with every
      # shard green (.lessons/10130.md); this turns any mismatch into a failure.
      - name: Check shard list matches SHARD_TOTAL
        run: |
          if [ "${{ strategy.job-total }}" != "$SHARD_TOTAL" ] || [ "${{ matrix.shard }}" != "$(( ${{ strategy.job-index }} + 1 ))" ]; then
            echo "::error::shard ${{ matrix.shard }} is job ${{ strategy.job-index }} of ${{ strategy.job-total }}, but the list must be exactly [1..$SHARD_TOTAL]"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Vitest runs a shard's files longest-first using the durations it
      # recorded on the previous run, so the slow files start early instead of
      # setting the tail. Keyed per commit so the timings stay current; the
      # shard count is in the key because it decides which files a shard holds.
      - name: Cache Vitest results
        uses: actions/cache@v5
        with:
          path: node_modules/.vite/vitest
          key: vitest-results-${{ runner.os }}-${{ matrix.shard }}of${{ env.SHARD_TOTAL }}-${{ github.sha }}
          restore-keys: |
            vitest-results-${{ runner.os }}-${{ matrix.shard }}of${{ env.SHARD_TOTAL }}-

      # The perf liveness guard runs in its own job below: it spawns a child per
      # scenario and alone took ~380s, which made its shard the long pole.
      - name: Test (vitest unit, shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }})
        run: npx vitest run --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }} --exclude scripts/perf/__tests__/scenarioLiveness.test.ts

  # Drives every perf scenario's run() once in a child process.
  perf-liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test (perf scenario liveness)
        run: npx vitest run scripts/perf/__tests__/scenarioLiveness.test.ts

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fontconfig cache key
        id: fontconfig-cache-key
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/fontconfig
          source /etc/os-release
          echo "ubuntu=${ID}-${VERSION_ID}-${VERSION_CODENAME}" >> "$GITHUB_OUTPUT"
          echo "fc_version=$(fc-cache --version 2>&1 | head -1)" >> "$GITHUB_OUTPUT"
          echo "font_pkg_hash=$(dpkg-query -W -f='${Package} ${Version}\n' 2>/dev/null | grep -E '^fonts-|^fontconfig' | LC_ALL=C sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache fontconfig
        id: cache-fontconfig
        uses: actions/cache@v5
        with:
          path: ~/.cache/fontconfig
          key: fontconfig-${{ runner.os }}-${{ runner.arch }}-${{ steps.fontconfig-cache-key.outputs.ubuntu }}-${{ steps.fontconfig-cache-key.outputs.fc_version }}-${{ steps.fontconfig-cache-key.outputs.font_pkg_hash }}

      - name: Warm fontconfig cache
        run: fc-cache -fv

      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build
        run: npm run build

      # Hard security gate (#9148) — no continue-on-error. Fails the build if any
      # E2E test backdoor survived the production strip in dist-electron/electron/preload.cjs.
      - name: Check preload backdoors stripped
        run: npm run check:preload-backdoors

      # Performance/size budgets (renderer bundle, first-render chunk, import
      # counts, compiler perf) are intentionally NOT run in CI during pre-1.0
      # development — premature gating just churns thresholds and blocks rapid
      # iteration, and Electron apps aren't payload-sensitive the way web apps
      # are. Reintroduce them (first as non-blocking signal, later as gates)
      # once the 1.0 feature set is frozen. The `*-budget:*` npm scripts remain
      # available to run locally on demand.

      - name: Smoke test
        run: xvfb-run --auto-servernum npm run test:smoke
        env:
          NODE_ENV: production
          ELECTRON_ENABLE_LOGGING: "1"
          DBUS_SESSION_BUS_ADDRESS: /dev/null
          SMOKE_RUNS: "1"
          SMOKE_TIMEOUT_MS: "210000"
          SMOKE_RETRIES: "1"
        timeout-minutes: 10

  # Gate job — use this as the sole required status check in branch protection.
  # Insulates against matrix/job name changes breaking required checks.
  ci-ok:
    if: always()
    needs: [static, lint, test, perf-liveness, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
