name: Release (macOS)

# Per-OS release workflow (#8052). macOS, Linux, and Windows each run their
# own full vertical slice (checks → unit tests → e2e → build → R2 upload →
# website notify) triggered by the same `v*` tag. A hung or failing Windows
# job no longer strands a green macOS/Linux build behind it — each OS
# publishes the moment its own pipeline is green, and re-running a failed OS
# is a single-workflow re-trigger instead of a full release re-run. The R2
# layout is already per-OS independent (`*.dmg`/`*.zip`/`latest-mac.yml` here
# vs `*.AppImage`/`latest-linux.yml` vs `*.exe`/`latest.yml`), and
# electron-updater on each OS only polls its own YAML, so there is no shared
# state to coordinate.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_notarization:
        description: "Skip macOS notarization (use when Apple's service is down)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run — exercise the full pipeline (gates + build + sign + notarize) without publishing to R2 or the website"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  # Per-OS so re-running macOS never queues behind a passing Windows/Linux run.
  # Keep real releases serialized per ref, but let dry runs bypass stale
  # rehearsals that may be wedged on a runner from an older branch SHA.
  group: release-macos-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.run_id || 'release' }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-install
        with:
          node_version: ${{ env.NODE_VERSION }}

      - name: Check
        run: npm run check

  unit-tests:
    name: Unit Tests (macOS)
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-install
        with:
          node_version: ${{ env.NODE_VERSION }}

      - name: Test
        run: npm run test

  e2e-core-gate:
    needs: [checks, unit-tests]
    uses: ./.github/workflows/e2e.yml
    with:
      suite: core
      platform: macos

  # The seven full-* domain buckets. e2e.yml auto-shards each one 4 ways
  # (#8053), so a single hung Windows-style spec — here, a hung macOS spec —
  # takes out 1/4 of one bucket instead of the whole macOS release.
  e2e-full-gate:
    needs: [checks, unit-tests]
    strategy:
      fail-fast: false
      matrix:
        suite:
          - full-terminal
          - full-worktree
          - full-presets
          - full-platform
          - full-panels
          - full-resilience
          - full-plugins
    uses: ./.github/workflows/e2e.yml
    with:
      suite: ${{ matrix.suite }}
      platform: macos

  # Online E2E runs for signal only — nothing `needs:` it, so it never gates
  # build or publish. Do NOT add job-level continue-on-error here: it is invalid
  # on reusable-workflow (`uses:`) jobs and makes the whole workflow fail to start.
  e2e-online-gate:
    needs: [checks, unit-tests]
    uses: ./.github/workflows/e2e.yml
    with:
      suite: online
      platform: macos
    secrets: inherit

  build-daintree:
    needs: [checks, unit-tests, e2e-core-gate, e2e-full-gate, e2e-online-gate]
    name: Build Daintree (macOS)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Resolve update metadata prefix
        uses: ./.github/actions/resolve-update-metadata-prefix

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-install
        with:
          node_version: ${{ env.NODE_VERSION }}

      - name: Import macOS certificates
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.MAC_CERTS }}
          p12-password: ${{ secrets.MAC_CERTS_PASSWORD }}
          keychain-password: ${{ secrets.MAC_CERTS_PASSWORD }}

      - name: Prepare Apple API key
        run: |
          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple/AuthKey.p8"
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}

      - name: Build (macOS)
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DEBUG: electron-builder,electron-notarize*,electron-osx-sign*
          npm_config_build_from_source: "true"
          DAINTREE_SKIP_NOTARIZATION: ${{ inputs.skip_notarization && 'true' || 'false' }}
        run: |
          npm run build
          # Hard security gate (#9148) — fail before packaging if any E2E
          # backdoor survived the production strip.
          npm run check:preload-backdoors
          PUBLISH_FLAG="always"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::warning::Dry run — skipping publish to electron-builder targets"
            PUBLISH_FLAG="never"
          fi
          EXTRA_ARGS=""
          if [ "${{ inputs.skip_notarization }}" = "true" ]; then
            echo "::warning::Skipping macOS notarization (manually disabled)"
            EXTRA_ARGS="-c.mac.notarize=false"
          fi
          npx electron-builder --config electron-builder.config.cjs --publish "$PUBLISH_FLAG" -c.buildDependenciesFromSource=true $EXTRA_ARGS

      - name: Verify macOS notarization staple
        if: inputs.skip_notarization != true
        shell: bash
        run: |
          set -euo pipefail
          # Unpacked dir names come from electron-builder's getArchSuffix, which
          # returns "" for the default arch (x64) — so release/mac/ is the x64
          # bundle. Compressed artifacts carry an explicit -x64 suffix instead,
          # via the artifactName overrides in electron-builder.config.cjs (#10380).
          apps=(
            "release/mac-arm64/Daintree.app"
            "release/mac/Daintree.app"
            "release/mac-universal/Daintree.app"
          )
          for app in "${apps[@]}"; do
            if [[ ! -d "$app" ]]; then
              echo "::error::Missing expected macOS app bundle: $app"
              exit 1
            fi
            echo "--- stapler validate (offline ticket): $app"
            xcrun stapler validate "$app"
            echo "--- codesign --check-notarization (online Apple ack): $app"
            # stapler validate only confirms a locally-attached ticket; this asks
            # Apple's notary service whether the notarization is still acknowledged.
            # Retry transient network failures, but treat exit 3 (valid signature,
            # not acknowledged) as a definitive revocation — never retry it.
            notary_exit=0
            for attempt in 1 2 3; do
              notary_exit=0
              codesign -vvvv -R="notarized" --check-notarization "$app" || notary_exit=$?
              if [[ $notary_exit -eq 0 || $notary_exit -eq 3 ]]; then
                break
              fi
              echo "::warning::check-notarization attempt $attempt failed (exit $notary_exit); retrying in 10s"
              sleep 10
            done
            if [[ $notary_exit -eq 3 ]]; then
              echo "::error::Notarization NOT acknowledged by Apple (on-disk signature valid but revoked or never recorded): $app"
              exit 1
            elif [[ $notary_exit -ne 0 ]]; then
              echo "::error::codesign --check-notarization failed (exit $notary_exit) after retries — bundle unsigned, invalid, does not meet the notarized requirement, or Apple's notary service is unreachable: $app"
              exit 1
            fi
            echo "--- spctl (diagnostic only): $app"
            spctl --assess --type execute --verbose --ignore-cache --no-cache "$app" || true
          done

      - name: Verify macOS signing audit (TeamIdentifier + hardened runtime + helper entitlements)
        # No skip_notarization guard: signing is a code-signing property that must
        # be validated even when notarization is manually disabled.
        shell: bash
        env:
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$EXPECTED_TEAM_ID" ]]; then
            echo "::error::APPLE_TEAM_ID secret is empty — cannot verify TeamIdentifier"
            exit 1
          fi
          apps=(
            "release/mac-arm64/Daintree.app"
            "release/mac/Daintree.app"
            "release/mac-universal/Daintree.app"
          )
          for app in "${apps[@]}"; do
            if [[ ! -d "$app" ]]; then
              echo "::error::Missing expected macOS app bundle: $app"
              exit 1
            fi
            # Signature integrity verification lives here (not the notarization
            # step) so it runs even when skip_notarization is true.
            echo "--- codesign --verify: $app"
            codesign --verify --deep --strict --verbose=4 "$app"
            scripts/ci/verify-team-identifier.sh "$app" "$EXPECTED_TEAM_ID"
            scripts/ci/verify-hardened-runtime.sh "$app"
            scripts/ci/verify-helper-entitlements.sh "$app"
          done

      - name: Validate update metadata (macOS)
        shell: bash
        run: |
          node scripts/ci/generate-update-metadata.mjs mac "release/${UPDATE_METADATA_PREFIX}-mac.yml"
          if [ ! -f "release/${UPDATE_METADATA_PREFIX}-mac.yml" ]; then
            echo "::error::Missing release/${UPDATE_METADATA_PREFIX}-mac.yml - macOS auto-update metadata was not generated"
            exit 1
          fi
          DMG_COUNT=$(find release -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')
          ZIP_COUNT=$(find release -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')
          if [ "$DMG_COUNT" -ne 3 ] || [ "$ZIP_COUNT" -ne 3 ]; then
            echo "::error::Expected 3 DMGs and 3 ZIPs, got $DMG_COUNT DMGs and $ZIP_COUNT ZIPs"
            find release -maxdepth 1 \( -name '*.dmg' -o -name '*.zip' \) -exec ls -la {} +
            exit 1
          fi
          echo "✓ Found $DMG_COUNT DMGs, $ZIP_COUNT ZIPs, and ${UPDATE_METADATA_PREFIX}-mac.yml"
          node scripts/ci/validate-update-metadata.mjs "release/${UPDATE_METADATA_PREFIX}-mac.yml"

      - name: Smoke test (packaged macOS)
        shell: bash
        timeout-minutes: 30
        env:
          NODE_ENV: production
          ELECTRON_ENABLE_LOGGING: "1"
          SMOKE_TIMEOUT_MS: "420000"
          SMOKE_RETRIES: "1"
        run: |
          set -euo pipefail
          # Smoke every published arch (matching the per-arch codesign/staple
          # audits above). The macos-14 runner is arm64; the x64 bundle runs via
          # the pre-installed Rosetta 2, and the universal bundle runs its arm64
          # slice — together exercising the unpacked natives of all three.
          for app in release/mac-arm64/Daintree.app release/mac/Daintree.app release/mac-universal/Daintree.app; do
            echo "::group::Packaged smoke — $app"
            PACKAGED_BINARY="$app/Contents/MacOS/Daintree" node scripts/run-packaged-smoke.mjs
            echo "::endgroup::"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-daintree-macos-14
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml
          retention-days: 7
          if-no-files-found: error

  publish-daintree:
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    needs: [build-daintree]
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Publish Daintree (macOS)
        uses: ./.github/actions/publish-daintree
        with:
          artifact_name: release-daintree-macos-14
          include_globs: "*.dmg *.zip *.blockmap"
          metadata_suffix: "-mac"
          release_platforms: mac
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_endpoint: ${{ secrets.R2_ENDPOINT }}
          r2_bucket: ${{ secrets.DAINTREE_R2_BUCKET }}
          website_webhook_secret: ${{ secrets.WEBSITE_WEBHOOK_SECRET }}
