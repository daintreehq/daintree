name: Release (macOS)

# Per-OS release workflow (#8052). macOS, Linux, and Windows each run their
# own full vertical slice (checks → unit tests → e2e → build → R2 upload →
# website notify) triggered by the same `v*` tag. A hung or failing Windows
# job no longer strands a green macOS/Linux build behind it — each OS
# publishes the moment its own pipeline is green, and re-running a failed OS
# is a single-workflow re-trigger instead of a full release re-run. The R2
# layout is already per-OS independent (`*.dmg`/`*.zip`/`latest-mac.yml` here
# vs `*.AppImage`/`latest-linux.yml` vs `*.exe`/`latest.yml`), and
# electron-updater on each OS only polls its own YAML, so there is no shared
# state to coordinate.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_notarization:
        description: "Skip macOS notarization (use when Apple's service is down)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run — exercise the full pipeline (gates + build + sign + notarize) without publishing to R2 or the website"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  # Per-OS so re-running macOS never queues behind a passing Windows/Linux run.
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: ./.github/actions/checkout-shallow

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-install
        with:
          node_version: ${{ env.NODE_VERSION }}

      - name: Check
        run: npm run check

  unit-tests:
    name: Unit Tests (macOS)
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: ./.github/actions/checkout-shallow

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-install
        with:
          node_version: ${{ env.NODE_VERSION }}

      - name: Test
        run: npm run test

  e2e-core-gate:
    needs: [checks, unit-tests]
    uses: ./.github/workflows/e2e.yml
    with:
      suite: core
      platform: macos

  # The six full-* domain buckets. e2e.yml auto-shards each one 4 ways
  # (#8053), so a single hung Windows-style spec — here, a hung macOS spec —
  # takes out 1/4 of one bucket instead of the whole macOS release.
  e2e-full-gate:
    needs: [checks, unit-tests]
    strategy:
      fail-fast: false
      matrix:
        suite:
          - full-terminal
          - full-worktree
          - full-presets
          - full-platform
          - full-panels
          - full-resilience
    uses: ./.github/workflows/e2e.yml
    with:
      suite: ${{ matrix.suite }}
      platform: macos

  e2e-online-gate:
    continue-on-error: true
    needs: [checks, unit-tests]
    uses: ./.github/workflows/e2e.yml
    with:
      suite: online
      platform: macos
    secrets: inherit

  build-daintree:
    needs: [checks, unit-tests, e2e-core-gate, e2e-full-gate]
    name: Build Daintree (macOS)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: ./.github/actions/checkout-shallow

      - name: Resolve update metadata prefix
        uses: ./.github/actions/resolve-update-metadata-prefix

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-install
        with:
          node_version: ${{ env.NODE_VERSION }}

      - name: Import macOS certificates
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.MAC_CERTS }}
          p12-password: ${{ secrets.MAC_CERTS_PASSWORD }}
          keychain-password: ${{ secrets.MAC_CERTS_PASSWORD }}

      - name: Prepare Apple API key
        run: |
          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple/AuthKey.p8"
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}

      - name: Download notarization state
        uses: actions/download-artifact@v7
        with:
          name: macos-notarization-state
          path: release/
        continue-on-error: true

      - name: Build (macOS)
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DAINTREE_SKIP_NOTARIZATION: ${{ inputs.skip_notarization && 'true' || '' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DEBUG: electron-builder,electron-notarize*,electron-osx-sign*
          npm_config_build_from_source: "true"
        run: |
          npm run build
          # Hard security gate (#9148) — fail before packaging if any E2E
          # backdoor survived the production strip.
          npm run check:preload-backdoors
          PUBLISH_FLAG="always"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::warning::Dry run — skipping publish to electron-builder targets"
            PUBLISH_FLAG="never"
          fi
          npx electron-builder --config electron-builder.config.cjs --publish "$PUBLISH_FLAG" -c.buildDependenciesFromSource=true

      - name: Verify macOS hardened runtime flag
        shell: bash
        run: |
          set -euo pipefail
          apps=(
            "release/mac-arm64/Daintree.app"
            "release/mac/Daintree.app"
            "release/mac-universal/Daintree.app"
          )
          for app in "${apps[@]}"; do
            if [[ ! -d "$app" ]]; then
              echo "::error::Missing expected macOS app bundle: $app"
              exit 1
            fi
            scripts/ci/verify-hardened-runtime.sh "$app"
          done

      - name: Verify macOS notarization and Gatekeeper
        if: inputs.skip_notarization != true
        shell: bash
        run: |
          set -euo pipefail
          # x64 has no arch suffix because electron-builder treats it as the default arch
          # (builder-util getArchSuffix returns "" for the default); arm64 and universal do.
          apps=(
            "release/mac-arm64/Daintree.app"
            "release/mac/Daintree.app"
            "release/mac-universal/Daintree.app"
          )
          for app in "${apps[@]}"; do
            if [[ ! -d "$app" ]]; then
              echo "::error::Missing expected macOS app bundle: $app"
              exit 1
            fi
            echo "--- codesign verify: $app"
            codesign --verify --deep --strict --verbose=4 "$app"
            echo "--- codesign check-notarization (online): $app"
            codesign -vvvv -R="notarized" --check-notarization "$app"
            echo "--- stapler validate: $app"
            xcrun stapler validate "$app"
            echo "--- spctl assess: $app"
            spctl --assess --type execute --verbose --ignore-cache --no-cache "$app"
          done

      - name: Verify macOS TeamIdentifier audit
        shell: bash
        env:
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$EXPECTED_TEAM_ID" ]]; then
            echo "::error::APPLE_TEAM_ID secret is empty — cannot verify TeamIdentifier"
            exit 1
          fi
          apps=(
            "release/mac-arm64/Daintree.app"
            "release/mac/Daintree.app"
            "release/mac-universal/Daintree.app"
          )
          for app in "${apps[@]}"; do
            scripts/ci/verify-team-identifier.sh "$app" "$EXPECTED_TEAM_ID"
          done

      - name: Upload notarization state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-notarization-state
          path: release/.notarization-state.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Validate update metadata (macOS)
        shell: bash
        run: |
          node scripts/ci/generate-update-metadata.mjs mac "release/${UPDATE_METADATA_PREFIX}-mac.yml"
          if [ ! -f "release/${UPDATE_METADATA_PREFIX}-mac.yml" ]; then
            echo "::error::Missing release/${UPDATE_METADATA_PREFIX}-mac.yml - macOS auto-update metadata was not generated"
            exit 1
          fi
          DMG_COUNT=$(find release -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')
          ZIP_COUNT=$(find release -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')
          if [ "$DMG_COUNT" -ne 3 ] || [ "$ZIP_COUNT" -ne 3 ]; then
            echo "::error::Expected 3 DMGs and 3 ZIPs, got $DMG_COUNT DMGs and $ZIP_COUNT ZIPs"
            find release -maxdepth 1 \( -name '*.dmg' -o -name '*.zip' \) -exec ls -la {} +
            exit 1
          fi
          echo "✓ Found $DMG_COUNT DMGs, $ZIP_COUNT ZIPs, and ${UPDATE_METADATA_PREFIX}-mac.yml"
          node scripts/ci/validate-update-metadata.mjs "release/${UPDATE_METADATA_PREFIX}-mac.yml"

      - name: Smoke test (packaged macOS)
        shell: bash
        timeout-minutes: 6
        env:
          PACKAGED_BINARY: release/mac-arm64/Daintree.app/Contents/MacOS/Daintree
          NODE_ENV: production
          ELECTRON_ENABLE_LOGGING: "1"
          SMOKE_TIMEOUT_MS: "210000"
        run: node scripts/run-packaged-smoke.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-daintree-macos-14
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml
          retention-days: 7
          if-no-files-found: error

  # Packaged-artifact smoke (#9246) — mounts the freshly-built DMG, copies the
  # .app out, removes the quarantine xattr (required even for notarized apps
  # on a headless CI runner that can't dismiss a Gatekeeper prompt), and runs
  # the binary in --smoke-test mode. Validates node-pty, better-sqlite3, and
  # posix-pty-reaper markers from the asar.unpacked tree. Gates publish.
  smoke-packaged:
    needs: [build-daintree]
    name: Smoke (packaged .app)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: ./.github/actions/checkout-shallow

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-install
        with:
          node_version: ${{ env.NODE_VERSION }}

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: release-daintree-macos-14
          path: ${{ runner.temp }}/release-artifact

      - name: Mount DMG and install app
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          # macos-14 runners are arm64 — prefer the native-arch DMG; fall back
          # to universal, then to anything *.dmg the artifact contains.
          DMG=$(find "$RUNNER_TEMP/release-artifact" -maxdepth 2 -name '*-arm64.dmg' | head -n 1)
          if [ -z "$DMG" ]; then
            DMG=$(find "$RUNNER_TEMP/release-artifact" -maxdepth 2 -name '*-universal.dmg' | head -n 1)
          fi
          if [ -z "$DMG" ]; then
            DMG=$(find "$RUNNER_TEMP/release-artifact" -maxdepth 2 -name '*.dmg' | head -n 1)
          fi
          if [ -z "$DMG" ]; then
            echo "::error::No .dmg found in downloaded artifact"
            find "$RUNNER_TEMP/release-artifact" -maxdepth 3 -type f | head -50
            exit 1
          fi
          echo "Selected DMG: $DMG"
          MOUNT="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$MOUNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG"
          # Ensure the mount is detached even if cp -R fails partway through;
          # without the trap a failed copy strands the device and the next
          # release run on a reusable runner would collide on the mountpoint.
          trap 'hdiutil detach "$MOUNT" 2>/dev/null || true' EXIT
          APP_SRC=$(find "$MOUNT" -maxdepth 2 -name '*.app' | head -n 1)
          if [ -z "$APP_SRC" ]; then
            echo "::error::No .app bundle found inside DMG"
            ls -la "$MOUNT" || true
            exit 1
          fi
          APP_DST="$RUNNER_TEMP/Daintree.app"
          cp -R "$APP_SRC" "$APP_DST"
          # Headless CI can't dismiss a Gatekeeper prompt; clearing quarantine
          # is required even when the app is notarized.
          xattr -rd com.apple.quarantine "$APP_DST" || true
          BIN="$APP_DST/Contents/MacOS/Daintree"
          if [ ! -x "$BIN" ]; then
            echo "::error::Expected executable missing at $BIN"
            ls -la "$APP_DST/Contents/MacOS" || true
            exit 1
          fi
          echo "packaged_binary=$BIN" >> "$GITHUB_OUTPUT"

      - name: Run packaged smoke
        env:
          PACKAGED_BINARY: ${{ steps.extract.outputs.packaged_binary }}
        run: node scripts/run-packaged-smoke.mjs

  publish-daintree:
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    needs: [build-daintree, smoke-packaged]
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Publish Daintree (macOS)
        uses: ./.github/actions/publish-daintree
        with:
          artifact_name: release-daintree-macos-14
          include_globs: "*.dmg *.zip *.blockmap"
          metadata_suffix: "-mac"
          release_platforms: mac
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_endpoint: ${{ secrets.R2_ENDPOINT }}
          r2_bucket: ${{ secrets.DAINTREE_R2_BUCKET }}
          website_webhook_secret: ${{ secrets.WEBSITE_WEBHOOK_SECRET }}
