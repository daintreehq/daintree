name: Nightly

on:
  schedule:
    # https://crontab.guru/#0_2_*_*_*
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to test"
        type: choice
        options:
          - all
          - macos
          - linux
          - windows
        default: all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: "22"

jobs:
  matrix-setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          PLATFORM="${{ inputs.platform || 'all' }}"

          if [ "$PLATFORM" = "macos" ]; then
            echo 'matrix={"include":[{"os":"macos-14","name":"macOS"}]}' >> "$GITHUB_OUTPUT"
          elif [ "$PLATFORM" = "linux" ]; then
            echo 'matrix={"include":[{"os":"ubuntu-22.04","name":"Linux"}]}' >> "$GITHUB_OUTPUT"
          elif [ "$PLATFORM" = "windows" ]; then
            echo 'matrix={"include":[{"os":"windows-latest","name":"Windows"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"os":"ubuntu-22.04","name":"Linux"},{"os":"macos-14","name":"macOS"},{"os":"windows-latest","name":"Windows"}]}' >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: matrix-setup
    runs-on: ${{ matrix.os }}
    name: Check (${{ matrix.name }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-setup.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: npm ci
        env:
          npm_config_msvs_version: "2022"

      - name: Install dependencies
        if: matrix.os != 'windows-latest'
        run: npm ci

      - name: Check (typecheck + lint + format)
        run: npm run check

  test:
    needs: matrix-setup
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.name }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-setup.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: npm ci
        env:
          npm_config_msvs_version: "2022"

      - name: Install dependencies
        if: matrix.os != 'windows-latest'
        run: npm ci

      - name: Test
        run: npm run test

  build:
    needs: [matrix-setup, check, test]
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-setup.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libarchive-tools \
            libxss-dev \
            libsecret-1-dev \
            libnss3-dev \
            libnotify-dev \
            libxkbfile-dev

      - name: Fontconfig cache key
        id: fontconfig-cache-key
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/fontconfig
          source /etc/os-release
          echo "ubuntu=${ID}-${VERSION_ID}-${VERSION_CODENAME}" >> "$GITHUB_OUTPUT"
          echo "fc_version=$(fc-cache --version 2>&1 | head -1)" >> "$GITHUB_OUTPUT"
          echo "font_pkg_hash=$(dpkg-query -W -f='${Package} ${Version}\n' 2>/dev/null | grep -E '^fonts-|^fontconfig' | LC_ALL=C sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache fontconfig
        id: cache-fontconfig
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/cache@v5
        with:
          path: ~/.cache/fontconfig
          key: fontconfig-${{ runner.os }}-${{ runner.arch }}-${{ steps.fontconfig-cache-key.outputs.ubuntu }}-${{ steps.fontconfig-cache-key.outputs.fc_version }}-${{ steps.fontconfig-cache-key.outputs.font_pkg_hash }}

      - name: Warm fontconfig cache
        if: matrix.os == 'ubuntu-22.04'
        run: fc-cache -fv

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: npm ci
        env:
          npm_config_msvs_version: "2022"

      - name: Install dependencies
        if: matrix.os != 'windows-latest'
        run: npm ci

      - name: Stamp nightly version
        shell: bash
        # Version must be unique per run. Date-only stamps collide on same-day
        # reruns and — combined with the `immutable` cache-control on binaries —
        # cause sha512 mismatches for clients who downloaded the earlier run.
        # UTC second-granular timestamp + short SHA gives us uniqueness and
        # traceability back to the commit.
        run: |
          STAMP=$(date -u +%Y%m%d%H%M%S)
          SHA=$(git rev-parse --short=7 HEAD)
          BASE=$(node -p "require('./package.json').version.replace(/-.*/, '')")
          NIGHTLY_VERSION="${BASE}-nightly.${STAMP}.${SHA}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${NIGHTLY_VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Stamped version: ${NIGHTLY_VERSION}"

      - name: Build
        run: npm run build

      - name: Smoke test (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: xvfb-run --auto-servernum npm run test:smoke
        env:
          NODE_ENV: production
          ELECTRON_ENABLE_LOGGING: "1"
          SMOKE_RUNS: "1"
          SMOKE_TIMEOUT_MS: "210000"
        timeout-minutes: 6

      - name: Smoke test (macOS)
        if: matrix.os == 'macos-14'
        run: npm run test:smoke
        env:
          NODE_ENV: production
          ELECTRON_ENABLE_LOGGING: "1"
          SMOKE_RUNS: "1"
          SMOKE_TIMEOUT_MS: "210000"
        timeout-minutes: 6

      - name: Smoke test (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run test:smoke
        env:
          NODE_ENV: production
          ELECTRON_ENABLE_LOGGING: "1"
          ELECTRON_ENABLE_STACK_DUMPING: "1"
          SMOKE_RUNS: "3"
          SMOKE_TIMEOUT_MS: "210000"
        timeout-minutes: 12

      - name: Import macOS certificates
        if: startsWith(matrix.os, 'macos')
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.MAC_CERTS }}
          p12-password: ${{ secrets.MAC_CERTS_PASSWORD }}
          keychain-password: ${{ secrets.MAC_CERTS_PASSWORD }}

      - name: Prepare Apple API key
        if: startsWith(matrix.os, 'macos')
        run: |
          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple/AuthKey.p8"
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}

      # Publish URL is set by electron-builder.config.cjs based on the stamped
      # -nightly.* version (routes to nightlyPublishUrl). We intentionally do
      # NOT pass -c.publish.url / -c.publish.channel CLI overrides: those
      # replace the array-shaped publish config with a plain object and strip
      # `provider: generic`, which fails schema validation. Everything the
      # nightly needs is expressed in the version string + config.
      - name: Package (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEBUG: electron-builder,electron-notarize*,electron-osx-sign*
          npm_config_build_from_source: "true"
        run: |
          npx electron-builder --config electron-builder.config.cjs --publish always \
            -c.buildDependenciesFromSource=true

      - name: Package (Linux/Windows)
        if: ${{ !startsWith(matrix.os, 'macos') }}
        shell: bash
        env:
          DEBUG: electron-builder,electron-notarize*,electron-osx-sign*
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            npx electron-builder --config electron-builder.config.cjs --publish never
          else
            npx electron-builder --config electron-builder.config.cjs --publish always
          fi

      # Nightly and stable both publish `latest*.yml` — URL separation (not
      # channel-name separation) distinguishes them. The nightly URL prefix is
      # set by the config when it sees a -nightly.* version.
      #
      # Windows: package validation still runs above, but Windows artifacts are
      # intentionally not uploaded from nightly. Microsoft Store distribution
      # happens through the release workflow only.
      - name: Generate update metadata (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: node scripts/ci/generate-update-metadata.mjs mac release/latest-mac.yml

      - name: Generate update metadata (Linux)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: node scripts/ci/generate-update-metadata.mjs linux release/latest-linux.yml

      - name: Validate update metadata (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          if [ ! -f "release/latest-mac.yml" ]; then
            echo "::error::Missing release/latest-mac.yml - macOS auto-update will not work"
            exit 1
          fi
          DMG_COUNT=$(find release -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')
          ZIP_COUNT=$(find release -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')
          if [ "$DMG_COUNT" -ne 3 ] || [ "$ZIP_COUNT" -ne 3 ]; then
            echo "::error::Expected 3 DMGs and 3 ZIPs, got $DMG_COUNT DMGs and $ZIP_COUNT ZIPs"
            find release -maxdepth 1 \( -name '*.dmg' -o -name '*.zip' \) -exec ls -la {} +
            exit 1
          fi
          echo "Found $DMG_COUNT DMGs, $ZIP_COUNT ZIPs, and latest-mac.yml"
          node scripts/ci/validate-update-metadata.mjs release/latest-mac.yml

      - name: Validate update metadata (Linux)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          if [ ! -f "release/latest-linux.yml" ]; then
            echo "::error::Missing release/latest-linux.yml - Linux auto-update will not work"
            exit 1
          fi
          node scripts/ci/validate-update-metadata.mjs release/latest-linux.yml

      - name: Upload build artifacts
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          retention-days: 3
          if-no-files-found: error

  integration-test:
    needs: [check, test]
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration

  # Static dead-code report. Moved off per-push CI (where it ran ~10min on
  # every commit without ever gating a merge) into nightly. Runs Linux-only
  # because the analysis is OS-agnostic.
  knip:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Knip (static dead-code report)
        run: npm run knip

  # Nightly runs the safety net without paying the Windows full-suite cost:
  # on the scheduled trigger (no `inputs.platform`), `core` and `online` run
  # across macOS, Linux, AND Windows; the seven full-* domain buckets and the
  # memory-leak `nightly` project stay on non-windows because a Windows full
  # run takes ~5–6 hours. Windows confidence for release comes from core,
  # online, and the Windows build/package jobs.
  #
  # Every job is a call into the unified e2e.yml runner, parameterised by
  # `suite`. Manual dispatch with an explicit `platform` value overrides the
  # defaults — e.g. `platform: windows` runs only Windows, `platform: all`
  # includes Windows for the full and nightly buckets too (the 5–6 hour
  # cost is intentional in that case).
  e2e-core:
    needs: [check, test]
    uses: ./.github/workflows/e2e.yml
    with:
      suite: core
      platform: ${{ inputs.platform || 'all' }}
      json_report: true
      emit_classification: true

  # Seven domain buckets, each a reusable-workflow call expanded across the OS
  # matrix inside e2e.yml. e2e.yml auto-shards every full-* suite 4 ways
  # (#8053), so with platform=non-windows that's 7 buckets × 2 OSes × 4 shards
  # = 56 independent jobs running in parallel — a hung shard takes out 1/4 of
  # one bucket instead of stalling the whole nightly. No knob needed here:
  # sharding is keyed on `suite` inside e2e.yml. The e2e-nightly call below
  # passes suite=nightly, which stays unsharded (serialized leak heuristic).
  e2e-full:
    needs: [check, test]
    strategy:
      fail-fast: false
      matrix:
        suite:
          - full-terminal
          - full-worktree
          - full-presets
          - full-platform
          - full-panels
          - full-resilience
          - full-plugins
    uses: ./.github/workflows/e2e.yml
    with:
      suite: ${{ matrix.suite }}
      platform: ${{ inputs.platform || 'non-windows' }}
      json_report: true
      enable_blob_report: true
      emit_classification: true

  e2e-online:
    needs: [check, test]
    uses: ./.github/workflows/e2e.yml
    with:
      suite: online
      platform: ${{ inputs.platform || 'all' }}
      json_report: true
      emit_classification: true
    secrets: inherit

  # Memory-leak detection — runs the `nightly` E2E suite. e2e.yml forces
  # --workers=1 for this suite (the leak heuristic depends on serialized
  # launches). Stays on non-windows for the same reason as full-* — the
  # Windows runtime is impractical for a scheduled nightly job.
  e2e-nightly:
    needs: [check, test]
    uses: ./.github/workflows/e2e.yml
    with:
      suite: nightly
      platform: ${{ inputs.platform || 'non-windows' }}
      json_report: true
      enable_blob_report: true
      emit_classification: true

  # Merges Playwright blob reports from every nightly e2e shard into a single
  # unified HTML report. Runs independently of publish — a broken merge must
  # not block nightly binary publishing.
  merge-playwright-reports:
    needs: [e2e-full, e2e-nightly]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download blob reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-*-blob-*
          path: ./blob-report
          merge-multiple: true

      - name: Merge blob reports
        continue-on-error: true
        run: npx playwright merge-reports ./blob-report --reporter=html

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-merged-playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    if: inputs.platform == '' || inputs.platform == 'all'
    needs: [build, e2e-core, e2e-full, e2e-online, e2e-nightly]
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: nightly-macos-14
          path: release/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: nightly-ubuntu-22.04
          path: release/

      - name: List nightly files
        run: ls -lah release/

      - name: Upload binaries to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.DAINTREE_R2_BUCKET }}
        run: |
          aws s3 sync release/ "s3://${R2_BUCKET}/nightly/" \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress \
            --exclude "*" \
            --include "*.dmg" \
            --include "*.zip" \
            --include "*.AppImage" \
            --include "*.deb" \
            --include "*.blockmap" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Verify binaries reachable on R2
        shell: bash
        env:
          PUBLISH_URL: https://updates.daintree.org/nightly/
          UPDATE_METADATA_PREFIX: latest
        run: node scripts/ci/verify-r2-uploads.mjs

      - name: Upload metadata to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.DAINTREE_R2_BUCKET }}
        run: |
          aws s3 sync release/ "s3://${R2_BUCKET}/nightly/" \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress \
            --exclude "*" \
            --include "latest*.yml" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Clean up old nightly builds
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.DAINTREE_R2_BUCKET }}
        run: |
          CUTOFF=$(date -u -d "3 days ago" +%Y-%m-%dT%H:%M:%S)
          echo "Deleting nightly objects older than ${CUTOFF}"

          OBJECTS=$(aws s3api list-objects-v2 \
            --endpoint-url "${R2_ENDPOINT}" \
            --bucket "${R2_BUCKET}" \
            --prefix "nightly/" \
            --query "Contents[?LastModified<='${CUTOFF}'].Key" \
            --output json 2>/dev/null || echo "[]")

          if [ "$OBJECTS" = "null" ] || [ "$OBJECTS" = "[]" ]; then
            echo "No old nightly objects to clean up"
            exit 0
          fi

          # Build the delete payload in batches of 1000
          echo "$OBJECTS" | node -e "
            const keys = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
            const filtered = keys.filter(k => k.startsWith('nightly/'));
            if (filtered.length === 0) { console.log('No objects to delete'); process.exit(0); }
            console.log('Deleting ' + filtered.length + ' old nightly objects');
            const batch = filtered.slice(0, 1000).map(k => ({ Key: k }));
            const payload = JSON.stringify({ Objects: batch, Quiet: true });
            require('fs').writeFileSync('/tmp/delete-payload.json', payload);
          "

          if [ -f /tmp/delete-payload.json ]; then
            aws s3api delete-objects \
              --endpoint-url "${R2_ENDPOINT}" \
              --bucket "${R2_BUCKET}" \
              --delete "file:///tmp/delete-payload.json"
            echo "Cleanup complete"
          fi

  notify:
    if: failure() && github.event_name == 'schedule'
    needs:
      [
        check,
        test,
        build,
        integration-test,
        knip,
        e2e-core,
        e2e-full,
        e2e-online,
        e2e-nightly,
        publish,
      ]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Full history required so git blame can attribute failing specs back
          # to the most recent author since the last green nightly.
          fetch-depth: 0

      - name: Download failure reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p failure-reports
          ARTIFACTS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name | startswith("failure-report-"))] | length')
          echo "Found ${ARTIFACTS} failure-report artifact(s)"

          if [ "$ARTIFACTS" -eq 0 ]; then
            echo "No failure reports to process"
            echo '[]' > failure-reports/all-failures.json
            exit 0
          fi

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("failure-report-")) | "\(.id)\t\(.name)"' \
            | while IFS=$'\t' read -r id name; do
              echo "Downloading artifact ${id} (${name})..."
              mkdir -p "failure-reports/${name}"
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/${id}/zip" > "failure-reports/${name}.zip"
              unzip -o "failure-reports/${name}.zip" -d "failure-reports/${name}/"
            done

      # Pulls the per-shard e2e-classification-*.json artifacts produced by
      # scripts/ci/classify-e2e-failures.mjs into /tmp/e2e-classifications/ so
      # a follow-up can fold bucket labels (Infrastructure / Test-Logic /
      # Product-Logic / Unclassified) into the per-signature issues that the
      # github-script step below creates. Failing silently is fine — when the
      # classifier ran but produced nothing, or when classification artifacts
      # aren't present at all, the per-signature flow still creates issues
      # without the bucket enrichment.
      - name: Download failure classification artifacts
        id: download-classifications
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/e2e-classifications
          mkdir -p /tmp/e2e-classifications
          if gh run download "${{ github.run_id }}" \
            --dir /tmp/e2e-classifications \
            --pattern 'e2e-classification-*' 2>/dev/null; then
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
            echo "Downloaded $(ls /tmp/e2e-classifications/*.json 2>/dev/null | wc -l) classification files"
          else
            echo "downloaded=false" >> "$GITHUB_OUTPUT"
            echo "No classification artifacts found"
          fi

      - name: Download failure manifests
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-manifest-*
          path: .nightly-failure-manifests/
          merge-multiple: true

      - name: Process failures and manage issues
        uses: actions/github-script@v8
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const workspace = process.env.GITHUB_WORKSPACE;
            const mod = await import(path.join(workspace, 'scripts/ci/process-nightly-issues.mjs'));

            // ---- Git-blame assignee routing ----
            // Independent of the per-signature dedup below: aggregate the
            // shard-level e2e-manifest artifacts into a single set of failing
            // spec paths, then git-blame those paths since the last green
            // nightly to pick the most-likely owner. Applied to every issue
            // created or updated in this run.
            const failedSpecs = new Set();
            const manifestDir = path.join(workspace, '.nightly-failure-manifests');
            if (fs.existsSync(manifestDir)) {
              for (const file of fs.readdirSync(manifestDir)) {
                if (!file.endsWith('.json')) continue;
                try {
                  const raw = fs.readFileSync(path.join(manifestDir, file), 'utf8');
                  const m = JSON.parse(raw);
                  for (const spec of m.failedSpecs || []) {
                    failedSpecs.add(spec);
                  }
                } catch {
                  // malformed manifest — skip
                }
              }
            }

            let lastGreenDate = null;
            try {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'nightly.yml',
                status: 'success',
                event: 'schedule',
                branch: context.payload.repository?.default_branch || 'develop',
                per_page: 1,
              });
              lastGreenDate = runs.data.workflow_runs[0]?.created_at ?? null;
            } catch (e) {
              core.warning(`Could not find last green nightly: ${e.message}`);
            }

            async function blameToAssignee(args, rationaleFn) {
              try {
                const { stdout } = await exec.getExecOutput('git', args, { silent: true });
                const counts = new Map();
                for (const line of stdout.trim().split('\n')) {
                  const m = line.match(/^[a-f0-9]{40} (.+ <[^>]+>)$/);
                  if (m) {
                    const author = m[1];
                    counts.set(author, (counts.get(author) || 0) + 1);
                  }
                }
                if (counts.size === 0) return { assignee: null, rationale: '' };
                const top = [...counts.entries()].sort((a, b) => b[1] - a[1])[0];
                const rationale = rationaleFn(top[0], top[1]);
                const emailMatch = top[0].match(/<(.+)>/);
                if (emailMatch) {
                  const email = emailMatch[1];
                  const { data: search } = await github.rest.search.users({ q: `${email} in:email` });
                  if (search.items?.length > 0) {
                    return { assignee: search.items[0].login, rationale };
                  }
                }
                return { assignee: null, rationale };
              } catch (e) {
                core.warning(`Git blame failed: ${e.message}`);
                return { assignee: null, rationale: '' };
              }
            }

            let assignee = null;
            let assigneeRationale = '';
            if (lastGreenDate && failedSpecs.size > 0) {
              const result = await blameToAssignee(
                ['log', `--since=${lastGreenDate}`, '--format=%H %an <%ae>', '--name-only', '--', ...failedSpecs],
                (author, n) => `${author} touched ${n} of the failing spec(s) since last green.`,
              );
              assignee = result.assignee;
              assigneeRationale = result.rationale;
            }
            if (!assignee && lastGreenDate) {
              const result = await blameToAssignee(
                ['log', `--since=${lastGreenDate}`, '--format=%H %an <%ae>'],
                (author, n) => `${author} had ${n} commit(s) since last green (no spec-level data).`,
              );
              assignee = result.assignee;
              assigneeRationale = result.rationale;
            }
            if (assigneeRationale) {
              console.log(`Routing rationale: ${assigneeRationale}`);
            }

            async function applyAssignee(issueNumber) {
              if (!assignee) {
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    labels: ['needs-triage'],
                  });
                } catch (e) {
                  core.warning(`Could not add needs-triage label to #${issueNumber}: ${e.message}`);
                }
                return;
              }
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  assignees: [assignee],
                });
              } catch (e) {
                core.warning(`Could not assign ${assignee} to #${issueNumber}: ${e.message}`);
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    labels: ['needs-triage'],
                  });
                } catch (e2) {
                  core.warning(`Could not add needs-triage fallback label to #${issueNumber}: ${e2.message}`);
                }
              }
            }

            // Bootstrap the needs-triage label lazily on first use so older
            // repos without it don't fail label assignment.
            if (!assignee) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'needs-triage',
                  color: 'fbca04',
                  description: 'Nightly failure requires manual triage — no clear owner found',
                });
              } catch {
                // already exists
              }
            }

            // Collect all failure reports from downloaded artifacts
            const reportsDir = path.join(workspace, 'failure-reports');
            const allFailures = [];

            if (fs.existsSync(reportsDir)) {
              const entries = fs.readdirSync(reportsDir, { withFileTypes: true });
              for (const entry of entries) {
                if (!entry.isDirectory()) continue;
                const reportPath = path.join(reportsDir, entry.name, 'failure-report.json');
                if (!fs.existsSync(reportPath)) continue;

                // Parse OS from artifact name: failure-report-{suite}-{osName}-s{shard}of{total}
                const osMatch = entry.name.match(/-(Linux|macOS|Windows)-s\d+of\d+$/);
                const osName = osMatch ? osMatch[1] : "unknown";

                try {
                  const content = fs.readFileSync(reportPath, 'utf8');
                  const reports = JSON.parse(content);
                  for (const r of reports) {
                    allFailures.push({ ...r, os: osName });
                  }
                } catch (err) {
                  console.error(`Failed to read ${reportPath}: ${err.message}`);
                }
              }
            }

            console.log(`Collected ${allFailures.length} failure(s) from artifacts`);

            if (allFailures.length === 0) {
              console.log('No test failures to process');
              return;
            }

            const deduped = mod.deduplicateReports(allFailures);
            const today = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const runId = context.runId;

            // Fetch all open nightly-failure issues
            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'nightly-failure',
                state: 'open',
                per_page: 100,
              }
            );

            console.log(`Fetched ${openIssues.length} open nightly-failure issues`);

            // Parse metadata from each issue
            const parsedIssues = openIssues.map((issue) => ({
              number: issue.number,
              title: issue.title,
              body: issue.body,
              labels: issue.labels.map((l) => l.name),
              metadata: mod.parseMetadata(issue.body),
            }));

            // Process each unique failure signature
            let created = 0;
            let updated = 0;

            for (const report of deduped) {
              const existing = mod.findIssueBySignature(parsedIssues, report.signature);
              const metadata = mod.nextMetadata(existing?.metadata ?? null, report, runId, runUrl, today);
              const title = mod.buildIssueTitle(report);
              const body = mod.buildIssueBody(report, metadata, runUrl);
              const labels = mod.labelsForIssue(report);
              const escalateLabels = mod.labelsForEscalation(metadata);

              if (existing) {
                const updateLabels = [...new Set([...existing.labels, ...labels, ...escalateLabels])];
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  title,
                  body,
                  labels: updateLabels,
                });

                if (escalateLabels.length > 0 && !existing.labels.includes('human-review')) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: existing.number,
                    body: mod.buildEscalationComment(),
                  });
                }

                await applyAssignee(existing.number);
                updated++;
              } else {
                const createdIssue = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: [...labels, ...escalateLabels],
                });
                await applyAssignee(createdIssue.data.number);
                created++;
              }
            }

            console.log(`Created ${created} new issue(s), updated ${updated} existing issue(s)`);

            // Stale sweep: close issues whose last_seen is >14 days ago
            let staleClosed = 0;
            for (const issue of parsedIssues) {
              if (!issue.metadata) continue;
              if (issue.labels.includes('human-review')) continue;
              if (!mod.shouldStaleClose(issue.metadata, today)) continue;

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'not_planned',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Auto-closed: this failure has not been seen in over 14 days. If it recurs, a new issue will be created.',
              });
              staleClosed++;
            }

            if (staleClosed > 0) {
              console.log(`Stale-closed ${staleClosed} issue(s)`);
            }

  notify-success:
    if: success() && github.event_name == 'schedule'
    needs:
      [
        check,
        test,
        build,
        integration-test,
        knip,
        e2e-core,
        e2e-full,
        e2e-online,
        e2e-nightly,
        publish,
      ]
    runs-on: ubuntu-22.04
    permissions:
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Close resolved failure issues
        uses: actions/github-script@v8
        with:
          script: |
            const path = require('node:path');
            const mod = await import(path.join(process.env.GITHUB_WORKSPACE, 'scripts/ci/process-nightly-issues.mjs'));

            const today = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'nightly-failure',
                state: 'open',
                per_page: 100,
              }
            );

            console.log(`Found ${openIssues.length} open nightly-failure issues`);

            let recovered = 0;
            let staleClosed = 0;

            for (const issue of openIssues) {
              const meta = mod.parseMetadata(issue.body);
              if (!meta) continue;

              const hasHumanReview = issue.labels.some((l) => l.name === 'human-review');
              if (hasHumanReview) continue;

              if (mod.shouldCloseOnGreen(meta, today)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: mod.buildRecoveredComment(runUrl),
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                recovered++;
              } else if (mod.shouldStaleClose(meta, today)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: 'Auto-closed: this failure has not been seen in over 14 days. If it recurs, a new issue will be created.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'not_planned',
                });
                staleClosed++;
              }
            }

            console.log(`Recovered (green close): ${recovered}, Stale-closed: ${staleClosed}`);
