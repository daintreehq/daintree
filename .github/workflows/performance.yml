name: Performance

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # onnxruntime-node (transitive via avr-vad for CPU-only Silero VAD) tries
  # to download optional CUDA/TensorRT GPU binaries from api.nuget.org on
  # postinstall. Daintree's VAD runs on CPU; the GPU binaries are never
  # loaded. The CI runner pool can't reliably reach nuget.org, so skip the
  # GPU download and let the bundled CPU runtime + binding node module
  # (already in the npm tarball) do the work.
  ONNXRUNTIME_NODE_INSTALL: "skip"

jobs:
  perf-ci:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run perf CI matrix
        run: npm run perf:ci

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-ci-results
          path: .tmp/perf-results/

  perf-nightly:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run nightly matrix
        run: npm run perf:nightly

      - name: Run soak matrix
        run: npm run perf:soak

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-nightly-results
          path: .tmp/perf-results/
