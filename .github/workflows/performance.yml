name: Performance

# This workflow measures; it does not gate. `scripts/perf/run.ts` exits 0 for
# any number, however bad, so nothing here can go red because something got
# slower. A red run means the apparatus broke: a scenario threw, the matrix
# contract was violated, the CLI was misused, or results could not be written.
# Treat every failure as "the benchmark is broken", never "the code is slow".
#
# The converse does not hold. A metric that stopped being emitted is reported
# as a MEASUREMENT ISSUE and a scenario that times out can still fail open into
# a finite sentinel sample, both of which exit 0 by design. Green means nothing
# threw; it is not evidence that the measurement still means anything. Read the
# job summary's measurement-issues section, not just the tick.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # onnxruntime-node (transitive via avr-vad for CPU-only Silero VAD) tries
  # to download optional CUDA/TensorRT GPU binaries from api.nuget.org on
  # postinstall. Daintree's VAD runs on CPU; the GPU binaries are never
  # loaded. The CI runner pool can't reliably reach nuget.org, so skip the
  # GPU download and let the bundled CPU runtime + binding node module
  # (already in the npm tarball) do the work.
  ONNXRUNTIME_NODE_INSTALL: "skip"

jobs:
  perf-ci:
    # Three OSes because Daintree ships on three and, until now, every recorded
    # number came from Linux — Windows and macOS performance was literally
    # unmeasured. The `ci` matrix runs in one Node process under tsx (it still
    # spawns real `git` and esbuild), so this job needs no packaged Electron
    # binary, no display server, no GTK/nss runtime list and no Playwright. The
    # one scenario that launches a real binary, PERF-004, is nightly-only and
    # stays in perf-nightly below.
    #
    # What three arms buy is a number for each OS at all, published to that
    # run's job summary. Not a trend: hosted runners hand out a fresh VM from a
    # pool of varying hardware, so run.ts stamps a per-run machine label and
    # every arm is a one-off snapshot that later runs are refused permission to
    # compare against. Trends come from the by-hand runs on real machines.
    #
    # The committed reference values are regenerated on Linux (perf-nightly),
    # and a baseline carries no machine identity, so the Windows and macOS arms
    # will annotate scenarios as "outside reference" purely because they are not
    # that Linux VM. Nothing fails on it — read those rows as machine
    # difference, not regression.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # `.nvmrc` rather than the repo-wide `NODE_VERSION: "22"` every other
      # workflow uses. Almost every scenario here measures plain V8 and Node
      # library code, so a silent 22.x patch bump moves the numbers with no
      # Daintree change behind it — and the harvested baseline files record no
      # Node version to explain the step afterwards.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # node-pty and friends are compiled from source here, and a cold Windows
      # runner fetching Electron headers is the flakiest step in the repo. The
      # retry wrapper distinguishes transient network failures from real compile
      # errors so a dropped connection costs a retry, not a lost night's data.
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: node scripts/ci/npm-ci-retry.mjs
        env:
          # Hosted windows-2022 images carry several MSVC toolchains; node-gyp
          # picks wrong without this. Same pin as stabilize.yml.
          npm_config_msvs_version: "2022"

      - name: Install dependencies
        if: runner.os != 'Windows'
        run: node scripts/ci/npm-ci-retry.mjs

      # run.ts appends its own markdown report to $GITHUB_STEP_SUMMARY, so the
      # numbers are one click away on every arm. Do not pipe or redirect this
      # command's stdout: the report reaches the summary by writing that file
      # directly, and the per-scenario lines plus the MEASUREMENT ISSUES block
      # go to stdout/stderr. The summary write is best-effort inside run.ts (it
      # warns rather than failing a run whose numbers are already on disk), so
      # the log is the fallback copy when Actions hands it an unwritable path.
      - name: Run perf CI matrix
        id: perf
        run: npm run perf ci

      # include-hidden-files because the results live under `.tmp/`, and
      # upload-artifact skips dotted path segments by default — without it the
      # artifact uploads and is silently empty.
      #
      # if-no-files-found escalates to error only when the run reported success:
      # "the harness said it wrote results and there are none" is the `results
      # could not be written` case and must be loud, while a run that already
      # failed should not also emit a second, derivative red step.
      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-ci-results-${{ matrix.os }}
          path: .tmp/perf-results/
          include-hidden-files: true
          if-no-files-found: ${{ steps.perf.outcome == 'success' && 'error' || 'warn' }}

      # The history file (scripts/perf/history/<mode>.<machine>.json) is a
      # TRACKED file by design — locally, `git log -p scripts/perf/history/`
      # is the performance archaeology tool. CI deliberately does NOT commit
      # it: on a hosted runner the machine label folds in the run id, because
      # every job gets a fresh VM from a pool of varying hardware and two
      # hosted runs are never the same machine. Committing that would add one
      # new file per run forever, each incomparable to the last. Hosted history
      # is per-run noise; it ships as an artifact, and the committed history
      # comes from real, stable machines run by hand.
      #
      # Uploaded separately from the results so its own emptiness is visible
      # rather than hidden behind a sibling path that did produce files.
      - name: Upload perf history
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-ci-history-${{ matrix.os }}
          path: scripts/perf/history/*.json
          if-no-files-found: ${{ steps.perf.outcome == 'success' && 'error' || 'warn' }}

  perf-nightly:
    # Linux-only: this job packages and launches the real binary for PERF-004,
    # and it is also where the committed reference values are regenerated (see
    # the regen steps below) — those must come from one consistent machine
    # class, so the Windows and macOS arms above never write a baseline.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # `.nvmrc` rather than the repo-wide `NODE_VERSION: "22"` every other
      # workflow uses. Almost every scenario here measures plain V8 and Node
      # library code, so a silent 22.x patch bump moves the numbers with no
      # Daintree change behind it — and the harvested baseline files record no
      # Node version to explain the step afterwards.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: node scripts/ci/npm-ci-retry.mjs

      # The in-process modes run BEFORE the packaging block on purpose: they
      # need none of it, and a broken electron-builder should not also cost the
      # smoke and ci reference values. `--update-baseline` rewrites
      # scripts/perf/config/baseline.<mode>.json from this run; the report still
      # compares against the pre-existing file, which is loaded before anything
      # is written, so regenerating and reporting in one pass is safe.
      #
      # None of these steps is continue-on-error. That flag used to be here
      # because a numeric regression exited 1; it no longer can, so the only
      # thing continue-on-error would suppress today is a genuine harness
      # failure — the exact class this workflow exists to make loud.
      - name: Regenerate smoke baseline
        run: npm run perf -- smoke --update-baseline

      - name: Regenerate CI baseline
        run: npm run perf -- ci --update-baseline

      # PERF-004 launches a real packaged binary, so the nightly matrix must
      # build one first (#10068). The `--dir` target skips AppImage/deb
      # packaging and outputs release/linux-unpacked/ directly.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libarchive-tools \
            libxss-dev \
            libsecret-1-dev \
            libnss3-dev \
            libnotify-dev \
            libxkbfile-dev

      - name: Build
        run: npm run build

      - name: Package Linux binary (dir target)
        run: npx electron-builder --config electron-builder.config.cjs --linux --dir --publish never

      - name: Verify packaged binary exists
        run: test -f release/linux-unpacked/daintree && test -x release/linux-unpacked/daintree

      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get install -y \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libasound2 \
            libxss1 \
            libxtst6 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libnotify4 \
            xvfb

      - name: Run nightly matrix
        env:
          DBUS_SESSION_BUS_ADDRESS: /dev/null
        run: xvfb-run --auto-servernum npm run perf -- nightly --update-baseline

      - name: Run soak matrix
        id: perf
        run: npm run perf -- soak --update-baseline

      # Second line of defence on the four files above. A regen step that throws
      # now fails the job outright, but a step can also write a baseline that is
      # structurally useless — a zero p95 (the `durationMs: 0` sentinel trap), a
      # mode written to the wrong file, a scenario missing entirely. Those look
      # identical to a healthy file until someone commits one. Its own log line
      # still says "refusing to open a baseline PR"; there is no PR step any
      # more, so read it as "these files are not fit to commit".
      - name: Verify regenerated baselines
        run: npm run perf verify-baselines

      # See the perf-ci arms for why include-hidden-files and if-no-files-found
      # are set this way. `steps.perf` is the last of the four matrix runs, so
      # reaching success there means every mode wrote its results.
      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-nightly-results
          path: .tmp/perf-results/
          include-hidden-files: true
          if-no-files-found: ${{ steps.perf.outcome == 'success' && 'error' || 'warn' }}

      - name: Upload perf history
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-nightly-history
          path: scripts/perf/history/*.json
          if-no-files-found: ${{ steps.perf.outcome == 'success' && 'error' || 'warn' }}

      # There is no job that opens a baseline PR, and there deliberately never
      # will be: the daintreehq org blocks Actions from creating pull requests,
      # so the previous automation was permanently jammed and its failures were
      # invisible. Baselines are harvested from this artifact and committed by
      # hand — .claude/rules/perf-benchmarks.md makes that the intended
      # workflow, and it is also the only way a human eyeballs the deltas before
      # they become the reference. Uploaded on failure too: two hours of runner
      # time should not evaporate because a later step went red.
      - name: Upload regenerated baselines
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-baselines
          path: scripts/perf/config/baseline.*.json
