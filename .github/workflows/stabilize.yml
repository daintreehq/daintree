name: Stabilize

# The comprehensive, cross-platform validation surface — the GitHub side of the
# `stabilize` skill (`.agents/skills/stabilize/`). It replaces the old scheduled
# `nightly.yml` test run. There is NO cron and NO issue creation: an agent (or a
# human) dispatches this when stabilizing the tree — before a release, or every
# few days — and triages the results itself. Failures surface as machine-readable
# artifacts (`failed-specs-*`, `failure-report-*`) plus the per-shard logs, which
# the skill reads to distinguish real regressions from E2E flakes and to scope
# intelligent re-runs (job re-run with `--test-list`, or `e2e-single.yml`).
#
# What it runs: check (typecheck/lint/format), unit, integration, build + smoke,
# and the full Playwright surface — core, all seven full-* buckets, online, and
# the nightly memory-leak suite — across the platforms selected by `platform`.
# Nightly BINARY publishing has moved to `nightly-publish.yml`; this workflow
# never publishes. knip is NOT here: it is a static, OS-agnostic report the
# skill runs once on the local Mac.
#
# Built for few, informative runs, because every dispatch costs the driving
# agent the better part of an hour:
#   - No job waits on another's verdict. check/test do NOT gate E2E, so a single
#     run surfaces every failure at once instead of one layer per dispatch (a
#     red Windows unit shard used to hide the entire Windows E2E result).
#   - `only` re-runs just the pieces a fix touched instead of the whole surface.
#   - The E2E app bundle is built once per OS (`e2e-build`) and handed to every
#     shard, rather than rebuilt ~60 times.
#
# `stabilize-ok` is the single gate to watch (`gh run watch`) for the overall
# verdict; drill into the per-suite jobs and artifacts for specifics.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platforms to validate. Default `linux-windows` — macOS is ALREADY covered by the mandatory local run on the dev Mac, so CI normally only needs Linux + Windows. `windows` alone is the usual iteration target (it's almost always the lone straggler). `all` adds macOS-on-CI and is rarely needed — only when a macOS issue genuinely can't be reproduced locally."
        type: choice
        default: linux-windows
        options:
          - linux-windows
          - windows
          - linux
          - all
          - non-windows
          - macos
      only:
        description: "Scoped re-run: space- or comma-separated pieces to run; empty = everything. Pieces: check test build integration core full-terminal full-worktree full-presets full-platform full-panels full-resilience full-plugins online nightly. Aliases: full (all seven full-* buckets), e2e (every E2E suite). Example: `test full-terminal`."
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Must be a superset of every permission declared by the reusable workflows this
# calls (`e2e.yml` declares `contents: read`). No `issues: write` — this workflow
# never opens issues; the driving agent owns triage.
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # onnxruntime-node (transitive via avr-vad for CPU-only Silero VAD) tries
  # to download optional CUDA/TensorRT GPU binaries from api.nuget.org on
  # postinstall. Daintree's VAD runs on CPU; the GPU binaries are never
  # loaded. The CI runner pool can't reliably reach nuget.org, so skip the
  # GPU download and let the bundled CPU runtime + binding node module
  # (already in the npm tarball) do the work.
  ONNXRUNTIME_NODE_INSTALL: "skip"

jobs:
  matrix-setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      test-matrix: ${{ steps.unit.outputs.matrix }}
      full-suites: ${{ steps.select.outputs.full-suites }}
      expected: ${{ steps.select.outputs.expected }}
    steps:
      # Resolve `only` into the set of jobs this run is expected to execute.
      # `expected` is keyed by job id and drives both the per-job `if:` and the
      # gate, which requires success from every expected job and tolerates
      # `skipped` only from the ones deliberately left out.
      - id: select
        env:
          ONLY: ${{ inputs.only }}
          PLATFORM: ${{ inputs.platform || 'linux-windows' }}
        run: |
          set -euo pipefail
          ALL_FULL="full-terminal full-worktree full-presets full-platform full-panels full-resilience full-plugins"
          ALL="check test build integration core $ALL_FULL online nightly"
          # No globbing: tokens are compared as literals, never expanded.
          set -f
          TOKENS=$(tr -s ',[:space:]' ' ' <<< "$ONLY")
          EXPLICIT=true
          if [ -z "${TOKENS// /}" ]; then
            TOKENS="$ALL"
            EXPLICIT=false
          fi

          SELECTED=""
          for t in $TOKENS; do
            case "$t" in
              full) SELECTED="$SELECTED $ALL_FULL" ;;
              e2e)  SELECTED="$SELECTED core $ALL_FULL online nightly" ;;
              *)
                case " $ALL " in
                  *" $t "*) SELECTED="$SELECTED $t" ;;
                  *)
                    echo "::error::Unknown piece '$t' in 'only'. Valid: $ALL full e2e"
                    exit 1
                    ;;
                esac
                ;;
            esac
          done
          has() { case " $SELECTED " in *" $1 "*) echo true ;; *) echo false ;; esac; }

          # integration-test is a Linux-only job; on a run with no Linux leg it
          # would only repeat what the Linux stage already proved.
          case "$PLATFORM" in
            windows|macos) INTEGRATION=false ;;
            *)             INTEGRATION=$(has integration) ;;
          esac

          FULL_SUITES=$(for s in $ALL_FULL; do if [ "$(has "$s")" = true ]; then echo "$s"; fi; done | jq -R . | jq -sc .)
          RUN_FULL=$(jq 'length > 0' <<< "$FULL_SUITES")
          RUN_E2E=false
          if [ "$RUN_FULL" = true ] || [ "$(has core)" = true ] || [ "$(has online)" = true ] || [ "$(has nightly)" = true ]; then
            RUN_E2E=true
          fi

          EXPECTED=$(jq -nc \
            --argjson check "$(has check)" --argjson test "$(has test)" --argjson build "$(has build)" \
            --argjson integration "$INTEGRATION" --argjson e2ebuild "$RUN_E2E" --argjson core "$(has core)" \
            --argjson full "$RUN_FULL" --argjson online "$(has online)" --argjson nightly "$(has nightly)" \
            '{"matrix-setup": true, check: $check, test: $test, build: $build, "integration-test": $integration,
              "e2e-build": $e2ebuild, "e2e-core": $core, "e2e-full": $full, "e2e-online": $online, "e2e-nightly": $nightly}')

          # A selection that resolves to nothing (e.g. `only=integration` on a
          # Windows-only run) would otherwise sail through the gate green
          # having validated nothing.
          if ! jq -e 'del(."matrix-setup") | any(.[]; . == true)' <<< "$EXPECTED" > /dev/null; then
            echo "::error::'only=$ONLY' selects no job that runs on platform '$PLATFORM'"
            exit 1
          fi
          echo "Explicit selection: $EXPLICIT"

          echo "full-suites=$FULL_SUITES" >> "$GITHUB_OUTPUT"
          echo "expected=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "Expected jobs: $EXPECTED"

      - id: set
        run: |
          PLATFORM="${{ inputs.platform || 'linux-windows' }}"

          case "$PLATFORM" in
            macos)         echo 'matrix={"include":[{"os":"macos-14","name":"macOS"}]}' >> "$GITHUB_OUTPUT" ;;
            linux)         echo 'matrix={"include":[{"os":"ubuntu-22.04","name":"Linux"}]}' >> "$GITHUB_OUTPUT" ;;
            windows)       echo 'matrix={"include":[{"os":"windows-2022","name":"Windows"}]}' >> "$GITHUB_OUTPUT" ;;
            non-windows)   echo 'matrix={"include":[{"os":"ubuntu-22.04","name":"Linux"},{"os":"macos-14","name":"macOS"}]}' >> "$GITHUB_OUTPUT" ;;
            linux-windows) echo 'matrix={"include":[{"os":"ubuntu-22.04","name":"Linux"},{"os":"windows-2022","name":"Windows"}]}' >> "$GITHUB_OUTPUT" ;;
            *)             echo 'matrix={"include":[{"os":"ubuntu-22.04","name":"Linux"},{"os":"macos-14","name":"macOS"},{"os":"windows-2022","name":"Windows"}]}' >> "$GITHUB_OUTPUT" ;;
          esac

      # Windows can exceed the job limit while the full unit suite is still
      # passing. Partition its files as regular CI does; keep other OSes whole.
      - id: unit
        env:
          PLATFORM_MATRIX: ${{ steps.set.outputs.matrix }}
        run: |
          MATRIX=$(jq -c '{include: [.include[] | . as $platform |
            (if .os == "windows-2022" then 4 else 1 end) as $count |
            range(1; $count + 1) as $shard |
            $platform + {shard: $shard, shards: $count}]}' <<< "$PLATFORM_MATRIX")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  check:
    needs: matrix-setup
    if: fromJSON(needs.matrix-setup.outputs.expected).check
    runs-on: ${{ matrix.os }}
    name: Check (${{ matrix.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-setup.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          # Ubuntu packages only: unrelated third-party indexes can be inconsistent.
          test -s /etc/apt/sources.list
          sudo apt-get -o Dir::Etc::sourceparts=- update
          sudo apt-get -o Dir::Etc::sourceparts=- install -y libarchive-tools

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-2022'
        run: node scripts/ci/npm-ci-retry.mjs
        env:
          npm_config_msvs_version: "2022"

      - name: Install dependencies
        if: matrix.os != 'windows-2022'
        run: node scripts/ci/npm-ci-retry.mjs

      - name: Check (typecheck + lint + format)
        run: npm run check

  test:
    needs: matrix-setup
    if: fromJSON(needs.matrix-setup.outputs.expected).test
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.name }} ${{ matrix.shard }}/${{ matrix.shards }})
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-setup.outputs.test-matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          # Ubuntu packages only: unrelated third-party indexes can be inconsistent.
          test -s /etc/apt/sources.list
          sudo apt-get -o Dir::Etc::sourceparts=- update
          sudo apt-get -o Dir::Etc::sourceparts=- install -y libarchive-tools

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-2022'
        run: node scripts/ci/npm-ci-retry.mjs
        env:
          npm_config_msvs_version: "2022"

      - name: Install dependencies
        if: matrix.os != 'windows-2022'
        run: node scripts/ci/npm-ci-retry.mjs

      - name: Test
        if: matrix.os != 'windows-2022'
        run: npm run test

      - name: Test (Windows shard)
        if: matrix.os == 'windows-2022'
        run: npm run test -- --shard=${{ matrix.shard }}/${{ matrix.shards }}

  # Production build + launch smoke on each platform. No packaging, signing, or
  # publishing here — that surface lives in the release dry-runs
  # (`release-{macos,linux,windows}.yml -f dry_run=true`) and, for binaries, in
  # `nightly-publish.yml`. This job only proves the app compiles and launches.
  build:
    needs: matrix-setup
    if: fromJSON(needs.matrix-setup.outputs.expected).build
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-setup.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # `npm run build` builds the vendored Go engine too; without the submodule
          # there is nothing to build it from.
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          # Ubuntu packages only: unrelated third-party indexes can be inconsistent.
          test -s /etc/apt/sources.list
          sudo apt-get -o Dir::Etc::sourceparts=- update
          sudo apt-get -o Dir::Etc::sourceparts=- install -y \
            libarchive-tools \
            libxss-dev \
            libsecret-1-dev \
            libnss3-dev \
            libnotify-dev \
            libxkbfile-dev

      - name: Fontconfig cache key
        id: fontconfig-cache-key
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/fontconfig
          source /etc/os-release
          echo "ubuntu=${ID}-${VERSION_ID}-${VERSION_CODENAME}" >> "$GITHUB_OUTPUT"
          echo "fc_version=$(fc-cache --version 2>&1 | head -1)" >> "$GITHUB_OUTPUT"
          echo "font_pkg_hash=$(dpkg-query -W -f='${Package} ${Version}\n' 2>/dev/null | grep -E '^fonts-|^fontconfig' | LC_ALL=C sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache fontconfig
        id: cache-fontconfig
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/cache@v5
        with:
          path: ~/.cache/fontconfig
          key: fontconfig-${{ runner.os }}-${{ runner.arch }}-${{ steps.fontconfig-cache-key.outputs.ubuntu }}-${{ steps.fontconfig-cache-key.outputs.fc_version }}-${{ steps.fontconfig-cache-key.outputs.font_pkg_hash }}

      - name: Warm fontconfig cache
        if: matrix.os == 'ubuntu-22.04'
        run: fc-cache -fv

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-2022'
        run: node scripts/ci/npm-ci-retry.mjs
        env:
          npm_config_msvs_version: "2022"

      - name: Install dependencies
        if: matrix.os != 'windows-2022'
        run: node scripts/ci/npm-ci-retry.mjs

      - name: Set up Go (assistant engine)
        uses: actions/setup-go@v5
        with:
          go-version-file: vendor/daintree-assistant/go.mod
          cache-dependency-path: vendor/daintree-assistant/go.sum

      - name: Build
        run: npm run build

      - name: Smoke test (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: xvfb-run --auto-servernum npm run test:smoke
        env:
          NODE_ENV: production
          ELECTRON_ENABLE_LOGGING: "1"
          DBUS_SESSION_BUS_ADDRESS: /dev/null
          SMOKE_RUNS: "1"
          SMOKE_TIMEOUT_MS: "210000"
          SMOKE_RETRIES: "1"
        timeout-minutes: 10

      - name: Smoke test (macOS)
        if: matrix.os == 'macos-14'
        run: npm run test:smoke
        env:
          NODE_ENV: production
          ELECTRON_ENABLE_LOGGING: "1"
          SMOKE_RUNS: "1"
          SMOKE_TIMEOUT_MS: "210000"
          SMOKE_RETRIES: "1"
        timeout-minutes: 10

      - name: Smoke test (Windows)
        if: matrix.os == 'windows-2022'
        run: npm run test:smoke
        env:
          NODE_ENV: production
          ELECTRON_ENABLE_LOGGING: "1"
          ELECTRON_ENABLE_STACK_DUMPING: "1"
          SMOKE_RUNS: "3"
          SMOKE_TIMEOUT_MS: "210000"
          SMOKE_RETRIES: "1"
        timeout-minutes: 16

  integration-test:
    needs: matrix-setup
    if: fromJSON(needs.matrix-setup.outputs.expected)['integration-test']
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux dependencies
        run: |
          # Ubuntu packages only: unrelated third-party indexes can be inconsistent.
          test -s /etc/apt/sources.list
          sudo apt-get -o Dir::Etc::sourceparts=- update
          sudo apt-get -o Dir::Etc::sourceparts=- install -y libarchive-tools

      - name: Install dependencies
        run: node scripts/ci/npm-ci-retry.mjs

      - name: Run integration tests
        run: npm run test:integration

  # One build:e2e per OS, shared by every E2E shard below via e2e.yml's
  # `prebuilt_artifact` input. The bundle is identical for every shard of a
  # given OS and SHA, so building it per shard only burned runner-hours and,
  # because the runner pool caps concurrency, wall-clock time.
  e2e-build:
    needs: matrix-setup
    if: fromJSON(needs.matrix-setup.outputs.expected)['e2e-build']
    runs-on: ${{ matrix.os }}
    name: E2E build (${{ matrix.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-setup.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-2022'
        run: node scripts/ci/npm-ci-retry.mjs
        env:
          npm_config_msvs_version: "2022"

      - name: Install dependencies
        if: matrix.os != 'windows-2022'
        run: node scripts/ci/npm-ci-retry.mjs

      - name: Build app
        run: npm run build:e2e
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # One tarball, not a directory upload: thousands of small files are slow
      # to upload and slower to download on Windows.
      - name: Pack build output
        shell: bash
        run: tar -czf e2e-build.tgz dist dist-electron

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: e2e-build-${{ matrix.name }}
          path: e2e-build.tgz
          # Long enough that "Re-run failed jobs" days later can still fetch it:
          # a re-run does not rebuild a successful e2e-build.
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  # The E2E callers run even when `e2e-build` failed (`!cancelled()`): its result
  # aggregates every OS, so a Windows-only install failure would otherwise skip
  # Linux E2E too and the run would lose a healthy platform's results. Shards of
  # the OS whose bundle is missing fail fast at the download step.
  #
  # Every E2E job is a call into the unified e2e.yml runner, parameterised by
  # `suite` and the dispatched `platform`. json_report emits the machine-readable
  # results the stabilize skill reads to separate real regressions from flakes;
  # enable_blob_report feeds the merged HTML report below.
  e2e-core:
    needs: [matrix-setup, e2e-build]
    if: ${{ !cancelled() && needs.matrix-setup.result == 'success' && fromJSON(needs.matrix-setup.outputs.expected)['e2e-core'] }}
    uses: ./.github/workflows/e2e.yml
    with:
      suite: core
      platform: ${{ inputs.platform || 'linux-windows' }}
      json_report: true
      prebuilt_artifact: e2e-build

  # The selected full-* domain buckets (all seven unless `only` narrows them),
  # fanned across the OS matrix inside e2e.yml, which auto-shards each bucket
  # (#8053).
  e2e-full:
    needs: [matrix-setup, e2e-build]
    if: ${{ !cancelled() && needs.matrix-setup.result == 'success' && fromJSON(needs.matrix-setup.outputs.expected)['e2e-full'] }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.matrix-setup.outputs.full-suites) }}
    uses: ./.github/workflows/e2e.yml
    with:
      suite: ${{ matrix.suite }}
      platform: ${{ inputs.platform || 'linux-windows' }}
      json_report: true
      enable_blob_report: true
      prebuilt_artifact: e2e-build

  e2e-online:
    needs: [matrix-setup, e2e-build]
    if: ${{ !cancelled() && needs.matrix-setup.result == 'success' && fromJSON(needs.matrix-setup.outputs.expected)['e2e-online'] }}
    uses: ./.github/workflows/e2e.yml
    with:
      suite: online
      platform: ${{ inputs.platform || 'linux-windows' }}
      json_report: true
      prebuilt_artifact: e2e-build
    secrets: inherit

  # Memory-leak detection — the `nightly` E2E suite (serialized, --workers=1,
  # forced by e2e.yml). It legitimately runs long, especially on Windows. macOS
  # is covered by the local run, so this rides the default `linux-windows` pass;
  # add macOS (`all`) only when a macOS-on-CI soak is genuinely essential.
  e2e-nightly:
    needs: [matrix-setup, e2e-build]
    if: ${{ !cancelled() && needs.matrix-setup.result == 'success' && fromJSON(needs.matrix-setup.outputs.expected)['e2e-nightly'] }}
    uses: ./.github/workflows/e2e.yml
    with:
      suite: nightly
      platform: ${{ inputs.platform || 'linux-windows' }}
      json_report: true
      enable_blob_report: true
      prebuilt_artifact: e2e-build

  # Merge Playwright blob reports from every shard into one HTML report for human
  # review. Non-gating (if: always()) — a broken merge must not flip the verdict.
  merge-playwright-reports:
    needs: [matrix-setup, e2e-full, e2e-nightly]
    if: always() && (needs.e2e-full.result != 'skipped' || needs.e2e-nightly.result != 'skipped')
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: node scripts/ci/npm-ci-retry.mjs --ignore-scripts

      - name: Download blob reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-*-blob-*
          path: ./blob-report
          merge-multiple: true

      - name: Merge blob reports
        continue-on-error: true
        run: npx playwright merge-reports ./blob-report --reporter=html

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stabilize-merged-playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Single gate to watch for the overall verdict. Mirrors ci.yml's `ci-ok`:
  # insulates the agent from matrix/job-name churn and folds every required job
  # into one pass/fail. The non-gating report-merge job is intentionally excluded.
  #
  # `matrix-setup` MUST be in `needs`: it is the shared upstream of every gated
  # job, so if it fails/cancels the downstream jobs go `skipped` (not failure) —
  # without it here, a malformed matrix would skip everything and the gate would
  # report green. `skipped` is a pass ONLY for a job that `only` deliberately
  # left out; an expected job that skipped (its upstream died) fails the gate,
  # and an unreadable `expected` map fails it too.
  stabilize-ok:
    if: always()
    needs:
      [
        matrix-setup,
        check,
        test,
        build,
        integration-test,
        e2e-build,
        e2e-core,
        e2e-full,
        e2e-online,
        e2e-nightly,
      ]
    runs-on: ubuntu-22.04
    timeout-minutes: 2

    steps:
      - name: Check results
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED: ${{ needs.matrix-setup.outputs.expected }}
        run: |
          set -euo pipefail
          if ! jq -e 'type == "object"' <<< "${EXPECTED:-null}" > /dev/null; then
            echo "::error::matrix-setup produced no job selection"
            exit 1
          fi
          BAD=$(jq -r --argjson expected "$EXPECTED" '
            to_entries[]
            | .key as $job | .value.result as $result
            | select(
                if $expected[$job] == true then $result != "success"
                else ($result != "skipped" and $result != "success") end)
            | "\($job): \($result)"' <<< "$NEEDS")
          if [ -n "$BAD" ]; then
            echo "::error::Jobs not green:"
            echo "$BAD"
            exit 1
          fi
          echo "All expected jobs succeeded."
