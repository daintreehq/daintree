name: Nightly Publish

# Publish-only nightly: build the macOS + Linux binaries, stamp a unique
# `-nightly.*` version, and publish them to the nightly auto-update channel
# (https://updates.daintree.org/nightly/) that users opt into via Settings →
# General. This is deliberately NOT a test run — the old test-heavy nightly was
# split out into the agent-driven `stabilize` workflow/skill. Validation belongs
# there and in release dry-runs; this workflow's only job is keeping the nightly
# channel fresh.
#
# Windows nightly binaries were never published (Windows distribution goes
# through the Microsoft Store in the release workflow), so only macOS + Linux
# (x64 and arm64, each on its native runner and its own feed) build here.
#
# Two release-hygiene gates run before anything reaches the feed, because a
# nightly client that can't boot can't auto-update its way out. They are not a
# test suite:
# - `check:preload-backdoors` right after the build, as in the release
#   workflows. The cron builds whatever `develop` points at, whether or not its
#   CI run passed.
# - The packaged launch smoke (`scripts/run-packaged-smoke.mjs`, #9246) on
#   every binary a feed offers: the macOS arm64 and universal bundles on the
#   build runner, the x64 bundle natively on Intel in `smoke-x64`, and each
#   Linux AppImage on its own runner. `publish` needs all of them and is the
#   only job that writes to R2 (the generic provider makes electron-builder's
#   `--publish always` a no-op), so a failed smoke leaves the channel stale.
#
# No failure alerting by design: the old nightly's rolling `nightly-failure`
# issue was retired with the test-nightly. A failed publish here is silent — the
# nightly channel simply goes stale (clients keep their last immutable build, so
# nothing breaks) until someone re-runs it. If stale-channel visibility ever
# matters, add a minimal `if: failure() && github.event_name == 'schedule'`
# notify step plus `issues: write` scoped to that step only.

on:
  schedule:
    # https://crontab.guru/#0_2_*_*_*
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # See ci.yml for why the onnxruntime GPU binaries are skipped.
  ONNXRUNTIME_NODE_INSTALL: "skip"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux
            linux_metadata: latest-linux.yml
          - os: ubuntu-22.04-arm
            name: Linux arm64
            linux_metadata: latest-linux-arm64.yml
          - os: macos-15
            name: macOS

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libarchive-tools \
            libxss-dev \
            libsecret-1-dev \
            libnss3-dev \
            libnotify-dev \
            libxkbfile-dev

      - name: Fontconfig cache key
        id: fontconfig-cache-key
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/fontconfig
          source /etc/os-release
          echo "ubuntu=${ID}-${VERSION_ID}-${VERSION_CODENAME}" >> "$GITHUB_OUTPUT"
          echo "fc_version=$(fc-cache --version 2>&1 | head -1)" >> "$GITHUB_OUTPUT"
          echo "font_pkg_hash=$(dpkg-query -W -f='${Package} ${Version}\n' 2>/dev/null | grep -E '^fonts-|^fontconfig' | LC_ALL=C sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache fontconfig
        id: cache-fontconfig
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/cache@v5
        with:
          path: ~/.cache/fontconfig
          key: fontconfig-${{ runner.os }}-${{ runner.arch }}-${{ steps.fontconfig-cache-key.outputs.ubuntu }}-${{ steps.fontconfig-cache-key.outputs.fc_version }}-${{ steps.fontconfig-cache-key.outputs.font_pkg_hash }}

      - name: Warm fontconfig cache
        if: startsWith(matrix.os, 'ubuntu')
        run: fc-cache -fv

      - name: Install dependencies
        run: node scripts/ci/npm-ci-retry.mjs

      - name: Stamp nightly version
        shell: bash
        # Version must be unique per run. Date-only stamps collide on same-day
        # reruns and — combined with the `immutable` cache-control on binaries —
        # cause sha512 mismatches for clients who downloaded the earlier run.
        # UTC second-granular timestamp + short SHA gives us uniqueness and
        # traceability back to the commit.
        run: |
          STAMP=$(date -u +%Y%m%d%H%M%S)
          SHA=$(git rev-parse --short=7 HEAD)
          BASE=$(node -p "require('./package.json').version.replace(/-.*/, '')")
          NIGHTLY_VERSION="${BASE}-nightly.${STAMP}.${SHA}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${NIGHTLY_VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Stamped version: ${NIGHTLY_VERSION}"

      - name: Build
        env:
          # tsc's type graph exceeds node's default old-space on the macOS runner
          # (~2 GB), aborting the build. Matches the release workflows.
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npm run build

      # Hard security gate (#9148): fail before packaging if any E2E backdoor
      # survived the production strip.
      - name: Check preload backdoors
        run: npm run check:preload-backdoors

      - name: Import macOS certificates
        if: startsWith(matrix.os, 'macos')
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.MAC_CERTS }}
          p12-password: ${{ secrets.MAC_CERTS_PASSWORD }}
          keychain-password: ${{ secrets.MAC_CERTS_PASSWORD }}

      - name: Prepare Apple API key
        if: startsWith(matrix.os, 'macos')
        run: |
          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple/AuthKey.p8"
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}

      # Publish URL is set by electron-builder.config.cjs based on the stamped
      # -nightly.* version (routes to nightlyPublishUrl). We intentionally do
      # NOT pass -c.publish.url / -c.publish.channel CLI overrides: those
      # replace the array-shaped publish config with a plain object and strip
      # `provider: generic`, which fails schema validation. Everything the
      # nightly needs is expressed in the version string + config.
      - name: Package (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEBUG: electron-builder,electron-notarize*,electron-osx-sign*
          NODE_OPTIONS: "--max-old-space-size=6144"
          npm_config_build_from_source: "true"
        run: |
          npx electron-builder --config electron-builder.config.cjs --publish always \
            -c.buildDependenciesFromSource=true

      - name: Package (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        env:
          DEBUG: electron-builder,electron-notarize*,electron-osx-sign*
        run: |
          npx electron-builder --config electron-builder.config.cjs --publish always

      # Nightly and stable both publish `latest*.yml` — URL separation (not
      # channel-name separation) distinguishes them. The nightly URL prefix is
      # set by the config when it sees a -nightly.* version.
      - name: Generate update metadata (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: node scripts/ci/generate-update-metadata.mjs mac release/latest-mac.yml

      - name: Generate update metadata (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: node scripts/ci/generate-update-metadata.mjs linux "release/${{ matrix.linux_metadata }}"

      - name: Validate update metadata (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          if [ ! -f "release/latest-mac.yml" ]; then
            echo "::error::Missing release/latest-mac.yml - macOS auto-update will not work"
            exit 1
          fi
          DMG_COUNT=$(find release -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')
          ZIP_COUNT=$(find release -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')
          if [ "$DMG_COUNT" -ne 3 ] || [ "$ZIP_COUNT" -ne 3 ]; then
            echo "::error::Expected 3 DMGs and 3 ZIPs, got $DMG_COUNT DMGs and $ZIP_COUNT ZIPs"
            find release -maxdepth 1 \( -name '*.dmg' -o -name '*.zip' \) -exec ls -la {} +
            exit 1
          fi
          echo "Found $DMG_COUNT DMGs, $ZIP_COUNT ZIPs, and latest-mac.yml"
          node scripts/ci/validate-update-metadata.mjs release/latest-mac.yml

      - name: Validate update metadata (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          if [ ! -f "release/${{ matrix.linux_metadata }}" ]; then
            echo "::error::Missing release/${{ matrix.linux_metadata }} - ${{ matrix.name }} auto-update will not work"
            exit 1
          fi
          node scripts/ci/validate-update-metadata.mjs "release/${{ matrix.linux_metadata }}"

      - name: Smoke test (packaged macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        timeout-minutes: 30
        env:
          NODE_ENV: production
          ELECTRON_ENABLE_LOGGING: "1"
          SMOKE_TIMEOUT_MS: "420000"
          SMOKE_RETRIES: "1"
        run: |
          set -euo pipefail
          # The x64 bundle runs natively on Intel in smoke-x64; under Rosetta
          # its startup outgrows the smoke budget (see release-macos.yml).
          for app in release/mac-arm64/Daintree.app release/mac-universal/Daintree.app; do
            echo "::group::Packaged smoke — $app"
            PACKAGED_BINARY="$app/Contents/MacOS/Daintree" node scripts/run-packaged-smoke.mjs
            echo "::endgroup::"
          done

      - name: Install Linux runtime dependencies (packaged smoke)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get install -y \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libasound2 \
            libxss1 \
            libxtst6 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libnotify4 \
            xvfb

      - name: Smoke test (packaged Linux)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        timeout-minutes: 10
        env:
          NODE_ENV: production
          ELECTRON_ENABLE_LOGGING: "1"
          DBUS_SESSION_BUS_ADDRESS: /dev/null
          SMOKE_TIMEOUT_MS: "210000"
          SMOKE_RETRIES: "1"
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(release/*.AppImage)
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "::error::Expected one AppImage in release/, found ${#appimages[@]}"
            exit 1
          fi
          appimage="$GITHUB_WORKSPACE/${appimages[0]}"
          chmod +x "$appimage"
          work="$RUNNER_TEMP/appimage-smoke"
          rm -rf "$work"
          mkdir -p "$work"
          # FUSE is unavailable on GitHub runners, so extract rather than mount.
          # The smoke runner supplies the APPDIR the AppImage runtime would set.
          (cd "$work" && "$appimage" --appimage-extract > /dev/null)
          if [ ! -x "$work/squashfs-root/AppRun" ]; then
            echo "::error::Extracted AppRun missing or not executable"
            exit 1
          fi
          PACKAGED_BINARY="$work/squashfs-root/AppRun" \
            xvfb-run --auto-servernum node scripts/run-packaged-smoke.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          retention-days: 3
          if-no-files-found: error

  # The x64 bundle, signed and stapled exactly as published, launched on Intel
  # hardware: the natives, boot, renderer and IPC that Intel users run.
  smoke-x64:
    needs: [build]
    name: Smoke (packaged macOS x64, Intel)
    runs-on: macos-15-intel
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # The smoke runner imports only Node built-ins, so no npm install.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: nightly-macos-15
          path: release/

      - name: Smoke test (packaged macOS x64)
        shell: bash
        timeout-minutes: 15
        env:
          NODE_ENV: production
          ELECTRON_ENABLE_LOGGING: "1"
          SMOKE_TIMEOUT_MS: "420000"
          SMOKE_RETRIES: "1"
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(release/Daintree-*-x64-mac.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected one x64 zip, found ${#zips[@]}"
            exit 1
          fi
          ditto -x -k "${zips[0]}" release/mac-x64
          PACKAGED_BINARY="release/mac-x64/Daintree.app/Contents/MacOS/Daintree" node scripts/run-packaged-smoke.mjs

  publish:
    # Every packaged smoke gates the upload: the build matrix runs the macOS
    # arm64/universal and Linux smokes, smoke-x64 the Intel one.
    needs: [build, smoke-x64]
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: node scripts/ci/npm-ci-retry.mjs --ignore-scripts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: nightly-macos-15
          path: release/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: nightly-ubuntu-22.04
          path: release/

      # Arch-distinct names (`-arm64.AppImage`, `_arm64.deb`,
      # `latest-linux-arm64.yml`), so it shares release/ with x64 safely.
      - name: Download Linux arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: nightly-ubuntu-22.04-arm
          path: release/

      - name: List nightly files
        run: ls -lah release/

      - name: Upload binaries to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.DAINTREE_R2_BUCKET }}
        run: |
          aws s3 sync release/ "s3://${R2_BUCKET}/nightly/" \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress \
            --exclude "*" \
            --include "*.dmg" \
            --include "*.zip" \
            --include "*.AppImage" \
            --include "*.deb" \
            --include "*.blockmap" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Verify binaries reachable on R2
        shell: bash
        env:
          PUBLISH_URL: https://updates.daintree.org/nightly/
          UPDATE_METADATA_PREFIX: latest
        run: node scripts/ci/verify-r2-uploads.mjs

      - name: Upload metadata to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.DAINTREE_R2_BUCKET }}
        run: |
          aws s3 sync release/ "s3://${R2_BUCKET}/nightly/" \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress \
            --exclude "*" \
            --include "latest*.yml" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Verify macOS metadata at CDN edge
        shell: bash
        env:
          PUBLISH_URL: https://updates.daintree.org/nightly/
          UPDATE_METADATA_PREFIX: latest
          METADATA_SUFFIX: "-mac"
        run: node scripts/ci/verify-r2-metadata.mjs

      - name: Verify Linux metadata at CDN edge
        shell: bash
        env:
          PUBLISH_URL: https://updates.daintree.org/nightly/
          UPDATE_METADATA_PREFIX: latest
          METADATA_SUFFIX: "-linux"
        run: node scripts/ci/verify-r2-metadata.mjs

      - name: Verify Linux arm64 metadata at CDN edge
        shell: bash
        env:
          PUBLISH_URL: https://updates.daintree.org/nightly/
          UPDATE_METADATA_PREFIX: latest
          METADATA_SUFFIX: "-linux-arm64"
        run: node scripts/ci/verify-r2-metadata.mjs

      - name: Clean up old nightly builds
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.DAINTREE_R2_BUCKET }}
        run: |
          CUTOFF=$(date -u -d "3 days ago" +%Y-%m-%dT%H:%M:%S)
          echo "Deleting nightly objects older than ${CUTOFF}"

          OBJECTS=$(aws s3api list-objects-v2 \
            --endpoint-url "${R2_ENDPOINT}" \
            --bucket "${R2_BUCKET}" \
            --prefix "nightly/" \
            --query "Contents[?LastModified<='${CUTOFF}'].Key" \
            --output json 2>/dev/null || echo "[]")

          if [ "$OBJECTS" = "null" ] || [ "$OBJECTS" = "[]" ]; then
            echo "No old nightly objects to clean up"
            exit 0
          fi

          # Build the delete payload in batches of 1000
          echo "$OBJECTS" | node -e "
            const keys = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
            const filtered = keys.filter(k => k.startsWith('nightly/'));
            if (filtered.length === 0) { console.log('No objects to delete'); process.exit(0); }
            console.log('Deleting ' + filtered.length + ' old nightly objects');
            const batch = filtered.slice(0, 1000).map(k => ({ Key: k }));
            const payload = JSON.stringify({ Objects: batch, Quiet: true });
            require('fs').writeFileSync('/tmp/delete-payload.json', payload);
          "

          if [ -f /tmp/delete-payload.json ]; then
            aws s3api delete-objects \
              --endpoint-url "${R2_ENDPOINT}" \
              --bucket "${R2_BUCKET}" \
              --delete "file:///tmp/delete-payload.json"
            echo "Cleanup complete"
          fi
