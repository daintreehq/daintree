# Publishes `plugins/blocklist.json`, the plugin kill-switch list, to
# https://updates.daintree.org/plugins/blocklist.json whenever a change to it
# lands on develop (#16774). Daintree fetches that URL and refuses to load any
# plugin version an entry names (`PluginBlocklistService`).
#
# Every run publishes the develop tip, not the commit that triggered it, and
# runs alone, so a late, queued or re-run job can never roll the live list
# back to an older commit. `publish-plugin-catalog.yml` publishes the community
# catalog the same way, as a separate workflow so a catalog problem can never
# hold up the kill-switch. To republish by hand:
#   gh workflow run publish-plugin-blocklist.yml --ref develop

name: Publish plugin blocklist

on:
  push:
    branches: [develop]
    paths:
      - plugins/blocklist.json
      - .github/workflows/publish-plugin-blocklist.yml
      - scripts/ci/verify-plugin-list.mjs
  workflow_dispatch:

permissions:
  contents: read

# Keyed by ref so a refused dispatch from another branch can't replace a
# develop run waiting in the queue.
concurrency:
  group: publish-plugin-blocklist-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  LIST_FILE: plugins/blocklist.json
  LIST_KEY: plugins/blocklist.json
  LIST_URL: https://updates.daintree.org/plugins/blocklist.json

jobs:
  publish:
    # A dispatch from any other branch, or a fork's develop, must not publish
    # a list that was never merged here.
    if: github.repository == 'daintreehq/daintree' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out the develop tip
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - name: Record what is being published
        shell: bash
        run: |
          echo "Publishing ${LIST_FILE} from develop at $(git rev-parse HEAD)"
          sha256sum "${LIST_FILE}"

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-install
        with:
          node_version: ${{ env.NODE_VERSION }}
          install_args: --ignore-scripts

      # The production schema, plus the checks the schema alone doesn't make:
      # valid semver ranges and no field the client would silently drop.
      - name: Validate the list
        shell: bash
        run: npm test -- electron/services/plugin/__tests__/pluginBlocklistSeed.test.ts

      - name: Upload to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.DAINTREE_R2_BUCKET }}
        run: |
          aws s3 cp "${LIST_FILE}" "s3://${R2_BUCKET}/${LIST_KEY}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress \
            --content-type application/json \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Verify the list at the CDN edge
        shell: bash
        run: node scripts/ci/verify-plugin-list.mjs
