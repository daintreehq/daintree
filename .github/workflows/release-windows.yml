name: Release (Windows)

# Per-OS release workflow (#8052) — see release-macos.yml for the rationale.
# Windows owns `*.exe`, `*.appx`, `*.msix`, and `latest.yml` (no platform
# suffix — electron-updater's Provider.getChannelFilePrefix() returns "" for
# win32) on R2. Microsoft Store submission stays inline here. A hung Windows
# E2E shard or a stalled Store submission now only delays Windows; macOS and
# Linux publish from their own workflows the moment they go green.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — exercise the full pipeline (gates + build) without publishing to R2, Microsoft Store, or the website"
        required: false
        type: boolean
        default: false
      smoke_artifact_run_id:
        description: "Optional existing release-windows run ID whose release-daintree-windows-latest artifact should be smoke-tested without rebuilding"
        required: false
        type: string
        default: ""
      force_publish:
        description: "Publish from a branch dispatch (no tag ref) — for completing a single-OS release that failed after the other OSes shipped. Version still comes from package.json."
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  # Keep real releases serialized per ref, but let dry runs bypass stale
  # rehearsals that may be wedged on a runner from an older branch SHA.
  group: release-windows-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.run_id || 'release' }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch' || inputs.smoke_artifact_run_id == ''
    name: Checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-install
        with:
          node_version: ${{ env.NODE_VERSION }}

      - name: Check
        run: npm run check

  unit-tests:
    if: github.event_name != 'workflow_dispatch' || inputs.smoke_artifact_run_id == ''
    name: Unit Tests (Windows)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-install
        with:
          node_version: ${{ env.NODE_VERSION }}
          msvs_version: "2022"

      - name: Test
        run: npm run test

  e2e-core-gate:
    if: github.event_name != 'workflow_dispatch' || inputs.smoke_artifact_run_id == ''
    needs: [checks, unit-tests]
    uses: ./.github/workflows/e2e.yml
    with:
      suite: core
      platform: windows

  # The motivating case for #8053: each full-* bucket auto-shards inside
  # e2e.yml, so a 39-minute serial Windows bucket becomes a shorter fan-out
  # and a hung Windows spec takes out one shard instead of stalling the entire
  # Windows release. The heaviest full-platform/full-worktree/full-panels buckets use
  # extra Windows slices to keep restart-heavy shards under the reusable
  # workflow timeout.
  e2e-full-gate:
    if: github.event_name != 'workflow_dispatch' || inputs.smoke_artifact_run_id == ''
    needs: [checks, unit-tests]
    strategy:
      fail-fast: false
      matrix:
        suite:
          - full-terminal
          - full-worktree
          - full-presets
          - full-platform
          - full-panels
          - full-resilience
          - full-plugins
    uses: ./.github/workflows/e2e.yml
    with:
      suite: ${{ matrix.suite }}
      platform: windows

  # Online E2E gates build and publish, same as core and full-* — a failing
  # real-agent run must not ship. Do NOT add job-level continue-on-error here:
  # it is invalid on reusable-workflow (`uses:`) jobs and makes the whole
  # workflow fail to start.
  e2e-online-gate:
    if: github.event_name != 'workflow_dispatch' || inputs.smoke_artifact_run_id == ''
    needs: [checks, unit-tests]
    uses: ./.github/workflows/e2e.yml
    with:
      suite: online
      platform: windows
    secrets: inherit

  build-daintree-x64:
    if: github.event_name != 'workflow_dispatch' || inputs.smoke_artifact_run_id == ''
    needs: [checks, unit-tests, e2e-core-gate, e2e-full-gate, e2e-online-gate]
    name: Build Daintree (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Resolve update metadata prefix
        uses: ./.github/actions/resolve-update-metadata-prefix

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-install
        with:
          node_version: ${{ env.NODE_VERSION }}
          msvs_version: "2022"

      - name: Build (x64)
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DEBUG: electron-builder,electron-notarize*,electron-osx-sign*
          BUILD_NUMBER: ${{ github.run_number }}
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          npm run build
          npm run check:preload-backdoors
          npx electron-builder --config electron-builder.config.cjs --win appx nsis --x64 --publish never

      - name: Verify Windows Store package was built (x64)
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path 'release\*.appx', 'release\*.msix' -ErrorAction SilentlyContinue)
          if ($packages.Count -eq 0) {
            Write-Host "::error::No .appx or .msix found in release/. Confirm electron-builder is configured with the appx target (see #7198)."
            Get-ChildItem -Path release -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }
            exit 1
          }
          Write-Host "Found $($packages.Count) Store package(s) in release/"

      - name: Verify Windows NSIS installer was built (x64)
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path 'release\*.exe' -ErrorAction SilentlyContinue)
          if ($installers.Count -ne 1) {
            Write-Host "::error::Expected exactly 1 NSIS .exe in release/, found $($installers.Count). Confirm electron-builder.config.cjs lists the nsis target."
            Get-ChildItem -Path release -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }
            exit 1
          }
          Write-Host "Found NSIS installer: $($installers[0].Name) ($([math]::Round($installers[0].Length / 1MB, 1)) MB)"

      - name: Smoke test (packaged Windows)
        shell: pwsh
        timeout-minutes: 12
        env:
          NODE_ENV: production
          ELECTRON_ENABLE_LOGGING: "1"
          SMOKE_TIMEOUT_MS: "210000"
          SMOKE_RETRIES: "1"
        run: |
          $setup = Get-ChildItem -Path 'release\*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { Write-Error "No NSIS .exe found in release/"; exit 1 }
          $extractDir = Join-Path $env:RUNNER_TEMP "daintree-packaged-smoke"
          Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          # 7-Zip extraction (preinstalled on windows-2022) is faster than an
          # NSIS silent install and avoids registry/shortcut side effects.
          7z x $setup.FullName -o"$extractDir" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "7z extraction of installer failed (exit $LASTEXITCODE)"; exit 1 }
          $nested = Get-ChildItem -Path $extractDir -Filter 'app-64.7z' -Recurse | Select-Object -First 1
          if ($nested) {
            7z x $nested.FullName -o"$extractDir\app" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Error "7z extraction of $($nested.Name) failed (exit $LASTEXITCODE)"; exit 1 }
          }
          $binary = Get-ChildItem -Path $extractDir -Filter 'Daintree.exe' -Recurse | Select-Object -First 1
          if (-not $binary) { Write-Error "Daintree.exe not found after extracting installer"; exit 1 }
          $env:PACKAGED_BINARY = $binary.FullName
          node scripts/run-packaged-smoke.mjs

      - name: Run WACK (Windows, best-effort)
        shell: pwsh
        continue-on-error: true
        run: |
          $appx = Get-ChildItem -Path release -Filter *.appx -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $appx) {
            $appx = Get-ChildItem -Path release -Filter *.msix -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }
          if (-not $appx) {
            Write-Host "::warning::No .appx or .msix found in release/ — skipping WACK"
            exit 0
          }
          $appcert = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\App Certification Kit\appcert.exe'
          if (-not (Test-Path $appcert)) {
            Write-Host "::warning::WACK (appcert.exe) not found at $appcert — skipping"
            exit 0
          }
          $report = Join-Path $env:RUNNER_TEMP 'wack-report.xml'
          & $appcert test -appxpackagepath $appx.FullName -reportoutputpath $report
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::WACK reported issues (exit $LASTEXITCODE). Microsoft re-runs WACK during certification — see $report for details."
          }

      - name: Check Microsoft Store secrets (Windows)
        id: store-secrets
        if: inputs.dry_run != true
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}
        run: |
          $configured = -not [string]::IsNullOrEmpty($env:PARTNER_CENTER_TENANT_ID) `
            -and -not [string]::IsNullOrEmpty($env:PARTNER_CENTER_SELLER_ID) `
            -and -not [string]::IsNullOrEmpty($env:PARTNER_CENTER_CLIENT_ID) `
            -and -not [string]::IsNullOrEmpty($env:PARTNER_CENTER_CLIENT_SECRET) `
            -and -not [string]::IsNullOrEmpty($env:STORE_PRODUCT_ID)
          $value = if ($configured) { 'true' } else { 'false' }
          "configured=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if (-not $configured) {
            Write-Host "::notice::Microsoft Store submission skipped — PARTNER_CENTER_* and STORE_PRODUCT_ID secrets not configured. The .appx is still built and archived to R2."
          }

      - name: Install Microsoft Store CLI (Windows)
        if: inputs.dry_run != true && steps.store-secrets.outputs.configured == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.3

      - name: Submit to Microsoft Store (Windows)
        if: inputs.dry_run != true && steps.store-secrets.outputs.configured == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}
        run: |
          msstore reconfigure `
            --tenantId $env:PARTNER_CENTER_TENANT_ID `
            --sellerId $env:PARTNER_CENTER_SELLER_ID `
            --clientId $env:PARTNER_CENTER_CLIENT_ID `
            --clientSecret $env:PARTNER_CENTER_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::msstore reconfigure failed (exit $LASTEXITCODE)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ":warning: Microsoft Store submission skipped — msstore reconfigure failed (exit $LASTEXITCODE)"
            exit $LASTEXITCODE
          }
          msstore publish . --appId $env:STORE_PRODUCT_ID --inputDirectory .\release
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::msstore publish failed (exit $LASTEXITCODE). If the failure is 'unknown command,' the CLI grammar may have shifted — run 'msstore --help' on the runner and update this step."
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ":warning: Microsoft Store submission skipped — msstore publish failed (exit $LASTEXITCODE)"
            exit $LASTEXITCODE
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ":rocket: Microsoft Store submission published (product $env:STORE_PRODUCT_ID)"

      - name: Upload build artifacts (x64)
        uses: actions/upload-artifact@v7
        with:
          name: release-daintree-windows-x64
          path: |
            release/*.appx
            release/*.msix
            release/*.exe
            release/*.blockmap
            release/*.yml
          retention-days: 7
          if-no-files-found: error

  build-daintree-arm64:
    if: github.event_name != 'workflow_dispatch' || inputs.smoke_artifact_run_id == ''
    needs: [checks, unit-tests, e2e-core-gate, e2e-full-gate, e2e-online-gate]
    name: Build Daintree (Windows arm64)
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-install
        with:
          node_version: ${{ env.NODE_VERSION }}
          msvs_version: "2022"

      - name: Build (arm64)
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DEBUG: electron-builder,electron-notarize*,electron-osx-sign*
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          npm run build
          npm run check:preload-backdoors
          # arm64 builds NSIS only (no AppX/Store target).
          npx electron-builder --config electron-builder.config.cjs --win nsis --arm64 --publish never

      - name: Verify Windows NSIS installer was built (arm64)
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path 'release\*.exe' -ErrorAction SilentlyContinue)
          if ($installers.Count -ne 1) {
            Write-Host "::error::Expected exactly 1 NSIS .exe in release/, found $($installers.Count). Confirm electron-builder.config.cjs lists the nsis target."
            Get-ChildItem -Path release -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }
            exit 1
          }
          Write-Host "Found NSIS installer: $($installers[0].Name) ($([math]::Round($installers[0].Length / 1MB, 1)) MB)"

      - name: Smoke test (packaged Windows arm64)
        shell: pwsh
        timeout-minutes: 12
        env:
          NODE_ENV: production
          ELECTRON_ENABLE_LOGGING: "1"
          SMOKE_TIMEOUT_MS: "210000"
          SMOKE_RETRIES: "1"
        run: |
          $setup = Get-ChildItem -Path 'release\*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { Write-Error "No NSIS .exe found in release/"; exit 1 }
          $extractDir = Join-Path $env:RUNNER_TEMP "daintree-packaged-smoke"
          Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          # 7-Zip extraction (preinstalled on windows-11-arm) is faster than an
          # NSIS silent install and avoids registry/shortcut side effects.
          7z x $setup.FullName -o"$extractDir" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "7z extraction of installer failed (exit $LASTEXITCODE)"; exit 1 }
          $nested = Get-ChildItem -Path $extractDir -Filter 'app-arm64.7z' -Recurse | Select-Object -First 1
          if ($nested) {
            7z x $nested.FullName -o"$extractDir\app" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Error "7z extraction of $($nested.Name) failed (exit $LASTEXITCODE)"; exit 1 }
          }
          $binary = Get-ChildItem -Path $extractDir -Filter 'Daintree.exe' -Recurse | Select-Object -First 1
          if (-not $binary) { Write-Error "Daintree.exe not found after extracting installer"; exit 1 }
          $env:PACKAGED_BINARY = $binary.FullName
          node scripts/run-packaged-smoke.mjs

      - name: Upload build artifacts (arm64)
        uses: actions/upload-artifact@v7
        with:
          name: release-daintree-windows-arm64
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
          retention-days: 7
          if-no-files-found: error

  assemble-windows-release:
    if: github.event_name != 'workflow_dispatch' || inputs.smoke_artifact_run_id == ''
    needs: [build-daintree-x64, build-daintree-arm64]
    name: Assemble Windows release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-install
        with:
          node_version: ${{ env.NODE_VERSION }}

      - name: Resolve update metadata prefix
        uses: ./.github/actions/resolve-update-metadata-prefix

      - name: Download x64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-daintree-windows-x64
          path: release/

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-daintree-windows-arm64
          path: release/

      - name: Generate and validate update metadata
        shell: bash
        run: |
          node scripts/ci/generate-update-metadata.mjs windows "release/${UPDATE_METADATA_PREFIX}.yml"
          if [ ! -f "release/${UPDATE_METADATA_PREFIX}.yml" ]; then
            echo "::error::Missing release/${UPDATE_METADATA_PREFIX}.yml - Windows auto-update metadata was not generated"
            exit 1
          fi
          node scripts/ci/validate-update-metadata.mjs "release/${UPDATE_METADATA_PREFIX}.yml"

      - name: Upload combined build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-daintree-windows-latest
          path: |
            release/*.appx
            release/*.msix
            release/*.exe
            release/*.blockmap
            release/*.yml
          retention-days: 7
          if-no-files-found: error

  # Packaged-artifact smoke (#9246) — runs the freshly-built NSIS installer
  # silently, locates the installed Daintree.exe via the per-user uninstall
  # registry entry (with a fixed-path fallback), and launches it in
  # --smoke-test mode. Validates the four native modules including
  # win-job-object (asar.unpacked native that doesn't ship a prebuilt and so
  # is uniquely at risk if cross-compile for arm64 fails silently). Gates
  # publish. always() is only here so the smoke_artifact_run_id dispatch can
  # smoke a prior run's artifact; otherwise assembly must have succeeded, or a
  # gate failure would skip assembly and leave this job downloading an artifact
  # that was never uploaded.
  smoke-packaged:
    if: always() && ((github.event_name == 'workflow_dispatch' && inputs.smoke_artifact_run_id != '') || needs.assemble-windows-release.result == 'success')
    needs: [assemble-windows-release]
    name: Smoke (packaged NSIS)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-install
        with:
          node_version: ${{ env.NODE_VERSION }}
          msvs_version: "2022"

      - name: Download build artifact
        if: github.event_name != 'workflow_dispatch' || inputs.smoke_artifact_run_id == ''
        uses: actions/download-artifact@v7
        with:
          name: release-daintree-windows-latest
          path: ${{ runner.temp }}/release-artifact

      - name: Download build artifact from existing run
        if: github.event_name == 'workflow_dispatch' && inputs.smoke_artifact_run_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_ARTIFACT_RUN_ID: ${{ inputs.smoke_artifact_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = Join-Path $env:RUNNER_TEMP 'release-artifact'
          Remove-Item -Recurse -Force $artifactDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          gh run download $env:SMOKE_ARTIFACT_RUN_ID --name release-daintree-windows-latest --dir $artifactDir

      - name: Install NSIS package
        id: extract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -Path "$env:RUNNER_TEMP\release-artifact" -Recurse -Filter '*.exe' |
            Where-Object { $_.Name -match '-setup\.exe$' } |
            Sort-Object Name)
          $runnerArch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
          $installer = $installers |
            Where-Object { $_.Name -match "-$runnerArch-setup\.exe$" } |
            Select-Object -First 1
          if (-not $installer -and $runnerArch -eq 'x64') {
            $installer = $installers |
              Where-Object { $_.Name -notmatch '-arm64-setup\.exe$' } |
              Select-Object -First 1
          }
          if (-not $installer) {
            Write-Host "::error::No NSIS installer matching runner architecture '$runnerArch' found in downloaded artifact"
            Get-ChildItem -Path "$env:RUNNER_TEMP\release-artifact" -Recurse | Select-Object -First 30 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Selected installer: $($installer.FullName)"
          # /S — silent NSIS install. perMachine=false in electron-builder
          # config means the installer lands under %LOCALAPPDATA%\Programs.
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            Write-Host "::error::Silent NSIS install failed with exit code $($proc.ExitCode)"
            exit $proc.ExitCode
          }
          # Locate the install via the per-user uninstall registry entry; fall
          # back to the default path electron-builder uses when the user
          # doesn't change it.
          $entry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue } |
            Where-Object { $_.DisplayName -eq 'Daintree' } |
            Select-Object -First 1
          $installDir = $null
          if ($entry -and $entry.InstallLocation) {
            $installDir = $entry.InstallLocation
          }
          if (-not $installDir -or -not (Test-Path $installDir)) {
            $fallback = Join-Path $env:LOCALAPPDATA 'Programs\Daintree'
            if (Test-Path $fallback) {
              $installDir = $fallback
            }
          }
          if (-not $installDir) {
            Write-Host "::error::Could not locate Daintree install directory after silent NSIS install"
            exit 1
          }
          $bin = Join-Path $installDir 'Daintree.exe'
          if (-not (Test-Path $bin)) {
            Write-Host "::error::Expected Daintree.exe missing at $bin"
            Get-ChildItem $installDir -Recurse -Depth 2 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Resolved packaged binary: $bin"
          "packaged_binary=$bin" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run packaged smoke
        env:
          PACKAGED_BINARY: ${{ steps.extract.outputs.packaged_binary }}
        run: node scripts/run-packaged-smoke.mjs

  publish-daintree:
    if: (startsWith(github.ref, 'refs/tags/v') || inputs.force_publish) && inputs.dry_run != true
    needs: [assemble-windows-release, smoke-packaged]
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Publish Daintree (Windows)
        uses: ./.github/actions/publish-daintree
        with:
          artifact_name: release-daintree-windows-latest
          include_globs: "*.appx *.msix *.exe *.blockmap"
          metadata_suffix: ""
          release_platforms: win
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_endpoint: ${{ secrets.R2_ENDPOINT }}
          r2_bucket: ${{ secrets.DAINTREE_R2_BUCKET }}
          website_webhook_secret: ${{ secrets.WEBSITE_WEBHOOK_SECRET }}
