name: E2E Tests

# Distinguish manual-dispatch runs in the Actions list. Reusable-workflow
# callers (release-{macos,linux,windows}.yml, stabilize.yml) keep their own
# parent run title; the matrix job names still make the suite visible inside
# the run.
run-name: ${{ inputs.suite || 'core' }} · ${{ inputs.platform || 'all' }}${{ inputs.test_file && format(' · {0}', inputs.test_file) || '' }}${{ inputs.shard && inputs.shard_total && format(' · shard {0}/{1}', inputs.shard, inputs.shard_total) || '' }}

# Unified runner for every E2E suite: core smoke, the seven full-* domain
# buckets, online (agent integration), and nightly (memory-leak detection).
# Pick the suite via the `suite` input; everything else (OpenCode install,
# ANTHROPIC_API_KEY, --workers=1 for nightly) is conditional on that choice.
# Single-file runs are supported via `test_file`.
#
# Internally, `suite` is passed to Playwright as `--project=<suite>` because
# that's Playwright's term for the same concept (an entry in the `projects:`
# array of playwright.config.ts).
#
# Callers that pass `suite: online` MUST use `secrets: inherit` so
# ANTHROPIC_API_KEY is reachable inside the called workflow.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to test on"
        type: choice
        default: "all"
        options:
          - all
          - macos
          - linux
          - windows
          - non-windows
          - linux-windows
      test_file:
        description: "Single test file to run (e.g. e2e/full/terminal/core-terminal-search.spec.ts). Leave empty to run the entire suite."
        type: string
        default: ""
      suite:
        description: "Suite to run. `full` is a meta-suite that runs all seven full-* buckets sequentially on one runner — handy for ad-hoc validation. Release and stabilize fan the buckets out across separate runners instead."
        type: choice
        default: "full"
        options:
          - full
          - core
          - full-terminal
          - full-worktree
          - full-presets
          - full-platform
          - full-panels
          - full-resilience
          - full-plugins
          - online
          - nightly
          - demo
      shard:
        description: "Optional single shard index to run, e.g. 2. Must be paired with shard_total."
        type: string
        default: ""
      shard_total:
        description: "Optional total shard count for a single-shard rerun, e.g. 4. Must be paired with shard."
        type: string
        default: ""
      json_report:
        description: "Enable Playwright JSON reporter for machine-readable test results (stabilize triage)."
        type: boolean
        default: false
  workflow_call:
    inputs:
      platform:
        description: "Platform to test on"
        type: string
        default: "all"
      test_file:
        description: "Single test file to run. Leave empty to run the entire suite."
        type: string
        default: ""
      suite:
        description: "Suite to run (full meta-suite, core, any full-* bucket, online, or nightly)"
        type: string
        default: "full"
      shard:
        description: "Optional single shard index to run. Must be paired with shard_total."
        type: string
        default: ""
      shard_total:
        description: "Optional total shard count for a single-shard rerun. Must be paired with shard."
        type: string
        default: ""
      json_report:
        description: "Enable Playwright JSON reporter for machine-readable test results (stabilize triage)."
        type: boolean
        default: false
      enable_blob_report:
        description: "Enable Playwright blob reporter so downstream jobs can merge reports across shards/OSes (stabilize sweep / release)."
        type: boolean
        default: false

permissions:
  contents: read

# Scope concurrency per (suite, platform, ref). The three per-OS release
# workflows (release-{macos,linux,windows}.yml) all call this for the same
# suite on the same ref, so a key that omits the platform collapses them
# into one group and cancel-in-progress: true makes them kill each other.
concurrency:
  group: e2e-${{ inputs.suite || 'core' }}-${{ inputs.platform || 'all' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Without this the pinned CLI self-updates on first launch and the online
  # release gate silently runs whatever version npm published today — see
  # scripts/ci/install-opencode.mjs.
  OPENCODE_DISABLE_AUTOUPDATE: "1"

jobs:
  # Determine which platforms to run on, and fan each one out into N shards.
  #
  # Sharding (#8053): the seven full-* domain buckets and the `full` meta-suite
  # split their spec list across SHARD_TOTAL parallel runners via Playwright's
  # native `--shard`. A 39-minute serial Windows bucket becomes ~10min
  # wall-time, and a hung shard takes out 1/N of the bucket instead of the
  # whole thing. The heaviest Windows full-platform/full-worktree/full-resilience/full-panels buckets use
  # extra slices so restart/persistence-heavy shards do not own enough serial
  # tests to hit the job timeout. core/online/nightly stay unsharded —
  # online hits real APIs (3 specs), and nightly's leak heuristic depends on serialized launches
  # (--workers=1); cross-runner sharding there would just add noise. A
  # single-file run (`test_file`) is one spec — no point sharding it.
  matrix-setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          PLATFORM="${{ inputs.platform || 'all' }}"
          SUITE="${{ inputs.suite || 'core' }}"
          TEST_FILE="${{ inputs.test_file }}"
          REQUESTED_SHARD="${{ inputs.shard }}"
          REQUESTED_SHARD_TOTAL="${{ inputs.shard_total }}"

          case "$PLATFORM" in
            macos)         OSES='[{"os":"macos-14","name":"macOS"}]' ;;
            linux)         OSES='[{"os":"ubuntu-22.04","name":"Linux"}]' ;;
            windows)       OSES='[{"os":"windows-2022","name":"Windows"}]' ;;
            non-windows)   OSES='[{"os":"macos-14","name":"macOS"},{"os":"ubuntu-22.04","name":"Linux"}]' ;;
            linux-windows) OSES='[{"os":"ubuntu-22.04","name":"Linux"},{"os":"windows-2022","name":"Windows"}]' ;;
            *)             OSES='[{"os":"macos-14","name":"macOS"},{"os":"ubuntu-22.04","name":"Linux"},{"os":"windows-2022","name":"Windows"}]' ;;
          esac

          # Only the full-* buckets and the `full` meta-suite fan out. N=4 is
          # the tuned starting point from #8053 (39min → ~10min on Windows).
          # Windows full-platform contains restart/persistence-heavy tests that
          # still form >45m shards at smaller splits, so use 16 slices there.
          # Windows full-terminal has one very large serial terminal-panels file;
          # 32 slices keeps that file isolated from terminal-link tests.
          # full-worktree has restart-heavy cross-project and deletion-cleanup
          # specs that can still exceed the 45m reusable workflow timeout at
          # 8 slices, so match full-platform's 16-slice Windows split. full-presets
          # has context-menu/custom-preset shards that also exceed the release
          # window at 8 slices, so it uses the same 16-slice Windows split.
          # full-panels has cold-launch-heavy settings/github/review files that
          # can pack into one long shard; 32 slices separates the forge/github
          # group from the specialized-palette group.
          # full-resilience's crash/error-recovery specs need the same Windows
          # split as other restart-heavy buckets; shard 2/8 can exceed the
          # 45-minute e2e job timeout when its crash-recovery files pack together.
          case "$SUITE" in
            full-terminal)
              if [ "$PLATFORM" = "windows" ] || [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "linux-windows" ]; then
                SHARD_TOTAL=32
              else
                SHARD_TOTAL=4
              fi
              ;;
            full-platform)
              if [ "$PLATFORM" = "windows" ] || [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "linux-windows" ]; then
                SHARD_TOTAL=16
              else
                SHARD_TOTAL=4
              fi
              ;;
            full-worktree|full-presets)
              if [ "$PLATFORM" = "windows" ] || [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "linux-windows" ]; then
                SHARD_TOTAL=16
              else
                SHARD_TOTAL=4
              fi
              ;;
            full-resilience)
              if [ "$PLATFORM" = "windows" ] || [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "linux-windows" ]; then
                SHARD_TOTAL=16
              else
                SHARD_TOTAL=4
              fi
              ;;
            full-panels)
              if [ "$PLATFORM" = "windows" ] || [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "linux-windows" ]; then
                SHARD_TOTAL=32
              else
                SHARD_TOTAL=4
              fi
              ;;
            full|full-*) SHARD_TOTAL=4 ;;
            *)           SHARD_TOTAL=1 ;;
          esac
          if [ -n "$TEST_FILE" ]; then
            SHARD_TOTAL=1
          fi
          if [ -n "$REQUESTED_SHARD" ] || [ -n "$REQUESTED_SHARD_TOTAL" ]; then
            if [ -z "$REQUESTED_SHARD" ] || [ -z "$REQUESTED_SHARD_TOTAL" ]; then
              echo "::error::shard and shard_total must be provided together"
              exit 1
            fi
            case "$REQUESTED_SHARD" in *[!0-9]*|"") echo "::error::shard must be a positive integer"; exit 1 ;; esac
            case "$REQUESTED_SHARD_TOTAL" in *[!0-9]*|"") echo "::error::shard_total must be a positive integer"; exit 1 ;; esac
            if [ "$REQUESTED_SHARD" -lt 1 ] || [ "$REQUESTED_SHARD_TOTAL" -lt 1 ] || [ "$REQUESTED_SHARD" -gt "$REQUESTED_SHARD_TOTAL" ]; then
              echo "::error::shard must be between 1 and shard_total"
              exit 1
            fi
            SHARD_TOTAL="$REQUESTED_SHARD_TOTAL"
          fi

          MATRIX=$(node -e '
            const oses = JSON.parse(process.argv[1]);
            const total = Number(process.argv[2]);
            const requested = process.argv[3] ? Number(process.argv[3]) : null;
            const suite = process.argv[4];
            const longWindowsSuites = new Set([
              "full-terminal",
              "full-worktree",
              "full-presets",
              "full-platform",
              "full-resilience",
              "full-panels",
            ]);
            function isLongWindowsShard(os) {
              return os.name === "Windows" && longWindowsSuites.has(suite);
            }
            function timeoutMinutes(os) {
              if (suite === "nightly") return 180;
              if (suite === "demo" || suite === "full") return 120;
              if (isLongWindowsShard(os)) return 90;
              if (suite.startsWith("full-")) return 45;
              return 90;
            }
            function watchdogTimeoutMinutes(os) {
              if (suite === "nightly") return 170;
              if (suite === "demo" || suite === "full") return 110;
              if (isLongWindowsShard(os)) return 80;
              if (suite.startsWith("full-")) return 40;
              return 80;
            }
            const include = [];
            for (const o of oses) {
              if (requested) {
                include.push({
                  ...o,
                  shard: requested,
                  shardTotal: total,
                  timeoutMinutes: timeoutMinutes(o),
                  watchdogTimeoutMinutes: watchdogTimeoutMinutes(o),
                });
              } else {
                for (let s = 1; s <= total; s++) {
                  include.push({
                    ...o,
                    shard: s,
                    shardTotal: total,
                    timeoutMinutes: timeoutMinutes(o),
                    watchdogTimeoutMinutes: watchdogTimeoutMinutes(o),
                  });
                }
              }
            }
            console.log(JSON.stringify({ include }));
          ' "$OSES" "$SHARD_TOTAL" "$REQUESTED_SHARD" "$SUITE")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  e2e:
    needs: matrix-setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-setup.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    name: ${{ inputs.suite || 'core' }} (${{ matrix.name }}${{ matrix.shardTotal > 1 && format(' {0}/{1}', matrix.shard, matrix.shardTotal) || '' }})
    # Sharding shrinks most full-* buckets, so a hung shard should fail fast
    # and re-run cheaply rather than burn the old 180min ceiling (the "core
    # (Windows) hung past 53min" failure mode from #8053). Windows
    # full-terminal, full-worktree, full-platform, and full-panels still contain serial files
    # that Playwright cannot split across shards, so Windows keeps the standard
    # 90min E2E window for those buckets.
    # nightly is unsharded and its serialized leak suite legitimately runs
    # long, so it keeps the generous ceiling; `full` (meta — all seven buckets on
    # one runner) gets a wider window than a single full-* shard.
    # demo is unsharded, workers=1, and each spec records a 4K screencast with a
    # 30min per-test ceiling, so it gets a wide window like nightly/full.
    timeout-minutes: ${{ matrix.timeoutMinutes }}

    steps:
      - name: Harden Windows for Electron E2E
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Disable real-time monitoring entirely (exclusions alone are insufficient)
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
          } catch {
            Write-Host "::warning::Could not disable Windows Defender real-time monitoring: $($_.Exception.Message)"
          }

          # Disable Windows Search indexer to prevent file handle contention
          Stop-Service -Name "WSearch" -Force -ErrorAction SilentlyContinue
          Set-Service -Name "WSearch" -StartupType Disabled -ErrorAction SilentlyContinue

          # Disable Superfetch/SysMain which can lock files during prefetch
          Stop-Service -Name "SysMain" -Force -ErrorAction SilentlyContinue
          Set-Service -Name "SysMain" -StartupType Disabled -ErrorAction SilentlyContinue

          # Disable diagnostics tracking that scans new executables
          Stop-Service -Name "DiagTrack" -Force -ErrorAction SilentlyContinue
          Set-Service -Name "DiagTrack" -StartupType Disabled -ErrorAction SilentlyContinue

          # Set display resolution to 1920x1080 so toolbar buttons don't overflow
          $device = Get-CimInstance -ClassName Win32_VideoController | Select-Object -First 1
          try {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction SilentlyContinue
          } catch {
            Write-Host "Set-DisplayResolution not available, continuing with default resolution"
          }

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Cache Playwright browsers
        id: cache-playwright
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve npm cache path
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm
        id: cache-npm
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libasound2 \
            libxss1 \
            libxtst6 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libnotify4 \
            xvfb

      - name: Fontconfig cache key
        id: fontconfig-cache-key
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/fontconfig
          source /etc/os-release
          {
            echo "ubuntu=${ID}-${VERSION_ID}-${VERSION_CODENAME}"
            echo "fc_version=$(fc-cache --version 2>&1 | head -1)"
            echo "font_pkg_hash=$(dpkg-query -W -f='${Package} ${Version}\n' 2>/dev/null | grep -E '^fonts-|^fontconfig' | LC_ALL=C sort | sha256sum | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Cache fontconfig
        id: cache-fontconfig
        if: runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          path: ~/.cache/fontconfig
          key: fontconfig-${{ runner.os }}-${{ runner.arch }}-${{ steps.fontconfig-cache-key.outputs.ubuntu }}-${{ steps.fontconfig-cache-key.outputs.fc_version }}-${{ steps.fontconfig-cache-key.outputs.font_pkg_hash }}

      - name: Warm fontconfig cache
        if: runner.os == 'Linux'
        run: fc-cache -fv

      - name: Install dependencies
        shell: bash
        run: node scripts/ci/npm-ci-retry.mjs

      - name: Verify Electron install
        run: node scripts/ci/verify-electron-install.mjs

      - name: Build app
        run: npm run build:e2e
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install Claude Code
        run: node scripts/ci/npm-install-retry.mjs -g @anthropic-ai/claude-code

      - name: Repair Claude Code native binary
        run: node scripts/ci/repair-claude-code-install.mjs

      - name: Install OpenCode
        if: inputs.suite == 'online'
        run: node scripts/ci/install-opencode.mjs

      - name: Configure Claude Code (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p ~/.claude
          echo '{"hasCompletedOnboarding": true}' > ~/.claude.json
          echo '{"model": "claude-haiku-4-5-20251001"}' > ~/.claude/settings.json

      - name: Configure Claude Code (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.claude" | Out-Null
          '{"hasCompletedOnboarding": true}' | Set-Content "$env:USERPROFILE\.claude.json"
          '{"model": "claude-haiku-4-5-20251001"}' | Set-Content "$env:USERPROFILE\.claude\settings.json"

      - name: Resolve test command
        id: test-cmd
        shell: bash
        run: |
          SUITE="${{ inputs.suite || 'core' }}"
          # `full` is a meta-suite that fans across all seven full-* buckets in
          # one runner. Each Playwright project becomes its own --project flag.
          # Single-bucket / single-test runs use one --project flag instead.
          if [ "$SUITE" = "full" ]; then
            PROJECT_ARGS="--project=full-terminal --project=full-worktree --project=full-presets --project=full-platform --project=full-panels --project=full-resilience --project=full-plugins"
          else
            PROJECT_ARGS="--project=$SUITE"
          fi
          # The `nightly` suite's leak heuristic depends on serialized
          # launches; --workers=1 is mandatory. The `demo` project already bakes
          # workers:1 into its config, but we pass the flag too as a guard.
          EXTRA=""
          if [ "$SUITE" = "nightly" ] || [ "$SUITE" = "demo" ]; then
            EXTRA="--workers=1"
          fi
          # Keep the command-level watchdog a few minutes under the job timeout
          # so Playwright can be killed and the always() artifact steps can run.
          WATCHDOG_TIMEOUT_MINUTES="${{ matrix.watchdogTimeoutMinutes }}"
          if [ -n "${{ inputs.test_file }}" ]; then
            echo "args=$PROJECT_ARGS $EXTRA ${{ inputs.test_file }}" >> "$GITHUB_OUTPUT"
          else
            echo "args=$PROJECT_ARGS $EXTRA" >> "$GITHUB_OUTPUT"
          fi
          echo "watchdog_timeout_minutes=$WATCHDOG_TIMEOUT_MINUTES" >> "$GITHUB_OUTPUT"

      # Download the failed-specs artifact from attempt 1 so a job-level retry
      # (via "Re-run failed jobs") can scope to --test-list and rerun only the
      # specs that failed before. Artifacts are scoped by run_id, so a retry
      # attempt can download artifacts from prior attempts of the same run.
      # Missing on attempt 1 (gated by if:) or if attempt 1 had zero failures
      # (continue-on-error skips the hard-fail). "Re-run all jobs" creates a
      # new run_id — the download fails harmlessly since the artifact doesn't
      # exist, and the arg resolution step falls back to a full-suite rerun.
      #
      # Always downloads the attempt-1 artifact (not attempt N-1). This is
      # intentionally conservative: a shrinking failure set across attempts
      # risks missing regressions introduced by the retry fix itself. Re-running
      # the full original failure list on every retry is safer and simpler.
      # (Playwright #33094: merging retry blobs with primary blobs can duplicate
      # entries, so per-attempt artifacts are deliberately kept separate.)
      - name: Download failed-specs from prior attempt
        if: github.run_attempt > 1
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: failed-specs-${{ inputs.suite || 'core' }}-${{ matrix.name }}-s${{ matrix.shard }}of${{ matrix.shardTotal }}-attempt-1
          path: .

      # Single source of truth for the shard slice and the retry gate.
      # Exporting via $GITHUB_ENV keeps the three OS run steps below identical
      # and prevents drift.
      - name: Resolve shard and retry args
        shell: bash
        run: |
          set -euo pipefail
          SUITE="${{ inputs.suite || 'core' }}"
          SHARD_INDEX="${{ matrix.shard }}"
          SHARD_TOTAL="${{ matrix.shardTotal }}"
          RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT:-1}"

          RETRY_ARGS=""
          # On retry, pass --test-list with the prior attempt's failed specs.
          # Gate: (a) retry attempt, (b) failed-specs file was downloaded and is
          # non-empty, (c) suite has meaningful retry semantics, (d) not already
          # scoped to a single test file.
          if [ "$RUN_ATTEMPT" -gt 1 ] \
             && [ -f failed-specs.txt ] \
             && [ -s failed-specs.txt ] \
             && [ "$SUITE" != "nightly" ] \
             && [ "$SUITE" != "online" ] \
             && [ -z "${{ inputs.test_file }}" ]; then
            RETRY_ARGS="--test-list failed-specs.txt"
            echo "[e2e] Retry attempt $RUN_ATTEMPT — running with --test-list ($(wc -l < failed-specs.txt) specs)"
          elif [ "$RUN_ATTEMPT" -gt 1 ] \
             && [ "$SUITE" != "nightly" ] \
             && [ "$SUITE" != "online" ] \
             && [ -z "${{ inputs.test_file }}" ]; then
            echo "::warning::Retry attempt but no failed-specs artifact found — falling back to full suite rerun"
          fi

          SHARD_ARGS=""
          if [ "$SHARD_TOTAL" -gt 1 ]; then
            if [ -n "$RETRY_ARGS" ]; then
              # The failed-specs artifact already contains only this shard's
              # failures. Re-applying --shard would re-slice that tiny list by
              # round-robin index — a 1-spec list lands entirely on shard 1,
              # starving every other shard's retry. Drop --shard and let
              # --test-list rerun exactly this shard's failures. (#8053)
              echo "[e2e] Retry with --test-list — dropping --shard for this attempt"
            else
              SHARD_ARGS="--shard=$SHARD_INDEX/$SHARD_TOTAL"
              echo "[e2e] Sharded run — slice $SHARD_INDEX of $SHARD_TOTAL"
            fi
          fi

          echo "RETRY_ARGS=$RETRY_ARGS" >> "$GITHUB_ENV"
          echo "SHARD_ARGS=$SHARD_ARGS" >> "$GITHUB_ENV"

      - name: Run ${{ inputs.suite || 'core' }} e2e tests (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          # Required for `online`; harmless empty string for other projects
          # when secrets aren't inherited.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCODE_E2E_ENABLED: ${{ inputs.suite == 'online' && '1' || '' }}
          FAIL_ON_FLAKY_TESTS: ${{ (inputs.suite == 'core' || inputs.suite == 'online') && 'true' || 'false' }}
          # Always emit the JSON report so the failed-specs extractor below has
          # something to read on retry. Stabilize triage (`inputs.json_report`)
          # piggybacks on the same file via `PLAYWRIGHT_JSON_REPORT`.
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/report.json
          PLAYWRIGHT_JSON_REPORT: ${{ inputs.json_report && '1' || '' }}
          PLAYWRIGHT_BLOB_REPORT: ${{ inputs.enable_blob_report && '1' || '' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          node scripts/ci/run-e2e-watchdog.mjs \
            --timeout-minutes "${{ steps.test-cmd.outputs.watchdog_timeout_minutes }}" \
            -- npx playwright test ${{ steps.test-cmd.outputs.args }} ${SHARD_ARGS:-} ${RETRY_ARGS:-}

      - name: Run ${{ inputs.suite || 'core' }} e2e tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCODE_E2E_ENABLED: ${{ inputs.suite == 'online' && '1' || '' }}
          FAIL_ON_FLAKY_TESTS: ${{ (inputs.suite == 'core' || inputs.suite == 'online') && 'true' || 'false' }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/report.json
          PLAYWRIGHT_JSON_REPORT: ${{ inputs.json_report && '1' || '' }}
          PLAYWRIGHT_BLOB_REPORT: ${{ inputs.enable_blob_report && '1' || '' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          node scripts/ci/run-e2e-watchdog.mjs \
            --timeout-minutes "${{ steps.test-cmd.outputs.watchdog_timeout_minutes }}" \
            -- xvfb-run --auto-servernum npx playwright test ${{ steps.test-cmd.outputs.args }} ${SHARD_ARGS:-} ${RETRY_ARGS:-}

      - name: Verify native modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node -e "try { require('node-pty'); console.log('node-pty: OK') } catch(e) { console.error('node-pty FAILED:', e.message); process.exit(1) }"

      - name: Run ${{ inputs.suite || 'core' }} e2e tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          ELECTRON_ENABLE_LOGGING: "1"
          # Keep Electron/browser process logs without the high-volume protocol
          # stream. On Windows, pw:protocol can flood stdout hard enough to
          # starve long panel shards before the watchdog timeout fires.
          DEBUG: "pw:browser"
          DEBUG_COLORS: "0"
          E2E_LAUNCH_TELEMETRY: "1"
          E2E_LAUNCH_TELEMETRY_FILE: ${{ runner.temp }}/e2e-launch-telemetry-${{ matrix.shard }}.jsonl
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCODE_E2E_ENABLED: ${{ inputs.suite == 'online' && '1' || '' }}
          FAIL_ON_FLAKY_TESTS: ${{ (inputs.suite == 'core' || inputs.suite == 'online') && 'true' || 'false' }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/report.json
          PLAYWRIGHT_JSON_REPORT: ${{ inputs.json_report && '1' || '' }}
          PLAYWRIGHT_BLOB_REPORT: ${{ inputs.enable_blob_report && '1' || '' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          node scripts/ci/run-e2e-watchdog.mjs \
            --timeout-minutes "${{ steps.test-cmd.outputs.watchdog_timeout_minutes }}" \
            -- npx playwright test ${{ steps.test-cmd.outputs.args }} ${SHARD_ARGS:-} ${RETRY_ARGS:-}

      # Extract failed spec paths from the JSON report so they can be uploaded
      # as a --test-list artifact for any retry attempt. Runs even on Playwright
      # failure (if: always()) — that's precisely when the retry needs the list.
      # Attempt artifacts are intentionally kept separate: merging retry blobs
      # with primary blobs can duplicate entries (Playwright #33094).
      - name: Extract failed specs from JSON report
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -f failed-specs.txt
          if [ -f test-results/report.json ] && [ -s test-results/report.json ]; then
            # Flaky specs report spec.ok === true but still fail the job under
            # FAIL_ON_FLAKY_TESTS (core/online), so a `.ok == false` filter
            # dropped them from the retry list. The extractor includes flaky
            # specs too — see scripts/ci/extract-failed-specs.mjs (#10039).
            node scripts/ci/extract-failed-specs.mjs test-results/report.json failed-specs.txt
            echo "[e2e] Extracted $(wc -l < failed-specs.txt) failed spec(s) from JSON report"
          else
            echo "[e2e] JSON report missing or empty — no failures to extract"
          fi

      - name: Upload failed-specs artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: failed-specs-${{ inputs.suite || 'core' }}-${{ matrix.name }}-s${{ matrix.shard }}of${{ matrix.shardTotal }}-attempt-${{ github.run_attempt }}
          path: failed-specs.txt
          retention-days: 7
          if-no-files-found: ignore

      # Extract structured failure data for stabilize triage. Only runs when the
      # caller opted into the triage pipeline (`inputs.json_report`) AND the
      # test run failed. The JSON report lives at `test-results/report.json`
      # — the same file the failed-specs extractor reads above — so both
      # consumers share a single artifact.
      - name: Extract failure signatures
        if: failure() && inputs.json_report
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p test-results
          if [ -f test-results/report.json ]; then
            node scripts/ci/extract-failures.mjs test-results/report.json test-results/failure-report.json
          else
            echo "[extract] No test-results/report.json found — skipping"
            echo '[]' > test-results/failure-report.json
          fi

      - name: Upload failure report
        if: failure() && inputs.json_report
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: failure-report-${{ inputs.suite || 'core' }}-${{ matrix.name }}-s${{ matrix.shard }}of${{ matrix.shardTotal }}-attempt-${{ github.run_attempt }}
          path: test-results/failure-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Collect crash dumps (fallback from platform default paths)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          FALLBACK_DIR="daintree-e2e-artifacts/fallback-crash-dumps"
          mkdir -p "$FALLBACK_DIR"

          case "$RUNNER_OS" in
            macOS)
              CRASHPAD_DIR="$HOME/Library/Application Support/Daintree/Crashpad"
              ;;
            Linux)
              CRASHPAD_DIR="$HOME/.config/Daintree/Crashpad"
              ;;
            Windows)
              CRASHPAD_DIR="$APPDATA/Daintree/Crashpad"
              ;;
            *)
              echo "[e2e] Unknown OS, skipping fallback crash dump collection"
              exit 0
              ;;
          esac

          for subdir in new pending completed; do
            if [ -d "$CRASHPAD_DIR/$subdir" ]; then
              cp -r "$CRASHPAD_DIR/$subdir" "$FALLBACK_DIR/$subdir" 2>/dev/null || true
            fi
          done

          # Count what we collected
          COLLECTED=$(find "$FALLBACK_DIR" -type f 2>/dev/null | wc -l)
          echo "[e2e] Fallback crash dump collection: $COLLECTED files"

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ inputs.suite || 'core' }}-results-${{ matrix.name }}-s${{ matrix.shard }}of${{ matrix.shardTotal }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            daintree-e2e-artifacts/
            artifacts/demo/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload blob report
        if: always() && inputs.enable_blob_report
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ inputs.suite || 'core' }}-blob-${{ matrix.name }}-s${{ matrix.shard }}of${{ matrix.shardTotal }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: ignore
