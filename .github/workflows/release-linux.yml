name: Release (Linux)

# Per-OS release workflow (#8052) — see release-macos.yml for the rationale.
# Linux owns `*.AppImage`, `*.deb`, and `latest-linux.yml` on R2; nothing it
# uploads can touch macOS or Windows metadata.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — exercise the full pipeline (gates + build) without publishing to R2 or the website"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  # Keep real releases serialized per ref, but let dry runs bypass stale
  # rehearsals that may be wedged on a runner from an older branch SHA.
  group: release-linux-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.run_id || 'release' }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-install
        with:
          node_version: ${{ env.NODE_VERSION }}

      - name: Check
        run: npm run check

  unit-tests:
    name: Unit Tests (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-install
        with:
          node_version: ${{ env.NODE_VERSION }}

      - name: Test
        run: npm run test

  e2e-core-gate:
    needs: [checks, unit-tests]
    uses: ./.github/workflows/e2e.yml
    with:
      suite: core
      platform: linux

  e2e-full-gate:
    needs: [checks, unit-tests]
    strategy:
      fail-fast: false
      matrix:
        suite:
          - full-terminal
          - full-worktree
          - full-presets
          - full-platform
          - full-panels
          - full-resilience
          - full-plugins
    uses: ./.github/workflows/e2e.yml
    with:
      suite: ${{ matrix.suite }}
      platform: linux

  # Online E2E gates build and publish, same as core and full-* — a failing
  # real-agent run must not ship. Do NOT add job-level continue-on-error here:
  # it is invalid on reusable-workflow (`uses:`) jobs and makes the whole
  # workflow fail to start.
  e2e-online-gate:
    needs: [checks, unit-tests]
    uses: ./.github/workflows/e2e.yml
    with:
      suite: online
      platform: linux
    secrets: inherit

  build-daintree:
    needs: [checks, unit-tests, e2e-core-gate, e2e-full-gate, e2e-online-gate]
    name: Build Daintree (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Resolve update metadata prefix
        uses: ./.github/actions/resolve-update-metadata-prefix

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-install
        with:
          node_version: ${{ env.NODE_VERSION }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libarchive-tools \
            libxss-dev \
            libsecret-1-dev \
            libnss3-dev \
            libnotify-dev \
            libxkbfile-dev

      - name: Build
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DEBUG: electron-builder,electron-notarize*,electron-osx-sign*
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          npm run build
          # Hard security gate (#9148) — fail before packaging if any E2E
          # backdoor survived the production strip.
          npm run check:preload-backdoors
          PUBLISH_FLAG="always"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::warning::Dry run — skipping publish to electron-builder targets"
            PUBLISH_FLAG="never"
          fi
          npx electron-builder --config electron-builder.config.cjs --publish "$PUBLISH_FLAG"

      - name: Validate update metadata (Linux)
        shell: bash
        run: |
          node scripts/ci/generate-update-metadata.mjs linux "release/${UPDATE_METADATA_PREFIX}-linux.yml"
          if [ ! -f "release/${UPDATE_METADATA_PREFIX}-linux.yml" ]; then
            echo "::error::Missing release/${UPDATE_METADATA_PREFIX}-linux.yml - Linux auto-update metadata was not generated"
            exit 1
          fi
          node scripts/ci/validate-update-metadata.mjs "release/${UPDATE_METADATA_PREFIX}-linux.yml"

      - name: Install Linux runtime dependencies (packaged smoke)
        run: |
          sudo apt-get install -y \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libasound2 \
            libxss1 \
            libxtst6 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libnotify4 \
            xvfb

      - name: Smoke test (packaged Linux)
        shell: bash
        timeout-minutes: 10
        env:
          PACKAGED_BINARY: ${{ github.workspace }}/squashfs-root/AppRun
          NODE_ENV: production
          ELECTRON_ENABLE_LOGGING: "1"
          DBUS_SESSION_BUS_ADDRESS: /dev/null
          SMOKE_TIMEOUT_MS: "210000"
          SMOKE_RETRIES: "1"
        run: |
          APPIMAGE=$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::No AppImage found in release/"
            exit 1
          fi
          chmod +x "$APPIMAGE"
          rm -rf squashfs-root
          # FUSE is unavailable on GitHub runners, so extract rather than mount.
          "$APPIMAGE" --appimage-extract
          xvfb-run --auto-servernum node scripts/run-packaged-smoke.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-daintree-ubuntu-22.04
          path: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/*.yml
          retention-days: 7
          if-no-files-found: error

  # Packaged-artifact smoke (#9246) — launches the freshly-built AppImage in
  # --smoke-test mode and validates every stability marker including the
  # node-pty, better-sqlite3, and posix-pty-reaper native module checks. Gates
  # publish so a regression in the packaged tree (e.g. an asar.unpacked native
  # missing for the build's arch) fails the release instead of shipping.
  smoke-packaged:
    needs: [build-daintree]
    name: Smoke (packaged AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-install
        with:
          node_version: ${{ env.NODE_VERSION }}

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libasound2 \
            libxss1 \
            libxtst6 \
            libatk1.0-0 \
            libdrm2

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: release-daintree-ubuntu-22.04
          path: ${{ runner.temp }}/release-artifact

      - name: Extract AppImage
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE=$(find "$RUNNER_TEMP/release-artifact" -maxdepth 2 -name '*.AppImage' | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::No .AppImage found in downloaded artifact"
            find "$RUNNER_TEMP/release-artifact" -maxdepth 3 -type f | head -50
            exit 1
          fi
          echo "Found AppImage: $APPIMAGE"
          chmod +x "$APPIMAGE"
          mkdir -p "$RUNNER_TEMP/appimage-work"
          cd "$RUNNER_TEMP/appimage-work"
          # --appimage-extract avoids FUSE, which is unavailable on GitHub
          # Actions hosted runners. The packaged smoke runner supplies APPDIR
          # when invoking the extracted AppRun entry point; the AppImage
          # runtime would normally do that when mounting the image.
          "$APPIMAGE" --appimage-extract
          BIN="$RUNNER_TEMP/appimage-work/squashfs-root/AppRun"
          if [ ! -x "$BIN" ]; then
            echo "::error::Extracted AppRun missing or not executable at $BIN"
            ls -la "$RUNNER_TEMP/appimage-work/squashfs-root" || true
            exit 1
          fi
          echo "packaged_binary=$BIN" >> "$GITHUB_OUTPUT"

      - name: Run packaged smoke
        env:
          PACKAGED_BINARY: ${{ steps.extract.outputs.packaged_binary }}
          DBUS_SESSION_BUS_ADDRESS: /dev/null
        run: xvfb-run --auto-servernum node scripts/run-packaged-smoke.mjs

  publish-daintree:
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    needs: [build-daintree, smoke-packaged]
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Publish Daintree (Linux)
        uses: ./.github/actions/publish-daintree
        with:
          artifact_name: release-daintree-ubuntu-22.04
          include_globs: "*.AppImage *.deb *.blockmap"
          metadata_suffix: "-linux"
          release_platforms: linux
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_endpoint: ${{ secrets.R2_ENDPOINT }}
          r2_bucket: ${{ secrets.DAINTREE_R2_BUCKET }}
          website_webhook_secret: ${{ secrets.WEBSITE_WEBHOOK_SECRET }}
